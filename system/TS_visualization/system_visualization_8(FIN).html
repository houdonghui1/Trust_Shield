<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多级可信根系统 - 硬件架构与启动过程可视化 v7</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================
   多级可信根系统可视化 v7 - 样式表
   Vibe Coding 风格 - 暗色科技霓虹主题
   改进：1.启动说明框右侧 2.精确布局 3.集群位置 4.步骤高亮
   v6新增：5.Vera Rubin 集群集成视图
   v7改进：Vera Rubin页面全屏布局+SVG缩放平移+11张参考图lightbox
   ============================================ */

:root {
  --bg-deep: #0a0e1a;
  --bg-panel: #111827;
  --bg-card: #1a2332;
  --bg-hover: #243447;
  --border-base: #2d3b4f;
  --border-glow: rgba(0, 240, 255, 0.3);
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent-lv3: #00f0ff;
  --accent-lv2: #a855f7;
  --accent-lv1: #10b981;
  --accent-ext: #f59e0b;
  --accent-trust: #fbbf24;
  --accent-danger: #ef4444;
  --accent-success: #22c55e;
  --grid-color: rgba(0, 240, 255, 0.05);
  --shadow-glow: 0 0 20px rgba(0, 240, 255, 0.15);
  --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  overflow: hidden;
  height: 100vh;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(var(--grid-color) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none; z-index: 0;
}

body::after {
  content: '';
  position: fixed; top: -20%; left: -10%;
  width: 60%; height: 60%;
  background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 60%);
  pointer-events: none; z-index: 0;
  animation: floatGlow 20s ease-in-out infinite;
}

@keyframes floatGlow {
  0%, 100% { transform: translate(0, 0); }
  50% { transform: translate(30%, 20%); }
}

/* ============ 主布局 ============ */
#app {
  display: grid;
  grid-template-rows: 56px 1fr 150px;
  grid-template-columns: 220px 1fr 320px;
  grid-template-areas:
    "header header header"
    "sidebar canvas detail"
    "timeline timeline timeline";
  height: 100vh;
  position: relative; z-index: 1;
}

/* ============ 顶部导航 ============ */
.header {
  grid-area: header;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
  background: rgba(17, 24, 39, 0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-base);
  z-index: 10;
}
.header-left { display: flex; align-items: center; gap: 16px; }
.logo {
  display: flex; align-items: center; gap: 10px;
  font-size: 18px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent-lv3), var(--accent-lv2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.logo-icon {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--accent-lv3), var(--accent-lv2));
  border-radius: 8px; font-size: 16px;
  -webkit-text-fill-color: var(--bg-deep);
}
.view-tabs {
  display: flex; gap: 4px;
  background: var(--bg-card); padding: 4px;
  border-radius: 10px; border: 1px solid var(--border-base);
}
.view-tab {
  padding: 6px 14px; font-size: 13px; font-weight: 500;
  color: var(--text-secondary); border: none; background: transparent;
  border-radius: 7px; cursor: pointer; transition: all var(--transition-fast);
}
.view-tab:hover { color: var(--text-primary); background: var(--bg-hover); }
.view-tab.active {
  color: var(--bg-deep);
  background: linear-gradient(135deg, var(--accent-lv3), #0ea5e9);
  box-shadow: 0 2px 8px rgba(0, 240, 255, 0.3);
}
.header-right { display: flex; gap: 8px; }
.header-btn {
  padding: 6px 14px; font-size: 13px;
  color: var(--text-secondary);
  background: var(--bg-card); border: 1px solid var(--border-base);
  border-radius: 8px; cursor: pointer; transition: all var(--transition-fast);
}
.header-btn:hover {
  color: var(--accent-lv3); border-color: var(--accent-lv3);
  box-shadow: 0 0 12px var(--border-glow);
}

/* ============ 左侧导航 ============ */
.sidebar {
  grid-area: sidebar;
  background: rgba(17, 24, 39, 0.6);
  backdrop-filter: blur(8px);
  border-right: 1px solid var(--border-base);
  padding: 16px 12px; overflow-y: auto;
}
.sidebar-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 12px; padding-left: 8px;
}
.nav-group { margin-bottom: 16px; }
.nav-group-header {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; font-size: 13px; font-weight: 600;
  color: var(--text-primary); border-radius: 8px;
  cursor: pointer; transition: all var(--transition-fast);
}
.nav-group-header:hover { background: var(--bg-hover); }
.nav-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.nav-children { margin-left: 12px; margin-top: 4px; }
.nav-item {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 10px; font-size: 12px;
  color: var(--text-secondary); border-radius: 6px;
  cursor: pointer; transition: all var(--transition-fast);
  border-left: 2px solid transparent;
}
.nav-item:hover { color: var(--text-primary); background: var(--bg-hover); border-left-color: var(--accent-lv3); }
.nav-item.active { color: var(--accent-lv3); background: rgba(0, 240, 255, 0.08); border-left-color: var(--accent-lv3); }

/* ============ 主画布 ============ */
.canvas-area {
  grid-area: canvas;
  position: relative; overflow: hidden;
  background: var(--bg-deep);
}
#svg-canvas { width: 100%; height: 100%; cursor: grab; }
#svg-canvas.dragging { cursor: grabbing; }

.node-group { cursor: pointer; transition: opacity var(--transition-fast); }
.node-group:hover .node-rect { filter: brightness(1.3); }
.node-rect { transition: all var(--transition-fast); }
.node-group.active .node-rect { stroke-width: 3; filter: drop-shadow(0 0 12px currentColor); }
.node-group.highlighted .node-rect { stroke-width: 2.5; filter: drop-shadow(0 0 8px currentColor); }
.node-group.dimmed { opacity: 0.2; }
.node-label { font-size: 12px; font-weight: 600; fill: var(--text-primary); pointer-events: none; text-anchor: middle; }
.node-sublabel { font-size: 10px; fill: var(--text-secondary); pointer-events: none; text-anchor: middle; }
.node-group.software .node-rect { stroke-dasharray: 3 2; }
.node-group.software .node-label { fill: var(--accent-ext); font-size: 10px; }
.node-group.container .node-rect { stroke-dasharray: 5 3; }

/* CPU核心节点突出样式 */
.node-group.cpu .node-rect {
  stroke-width: 3;
  filter: drop-shadow(0 0 8px currentColor);
  fill-opacity: 0.18;
}
.node-group.cpu .node-label { font-weight: 800; font-size: 12px; }
.node-cpu-badge { font-size: 8px; fill: var(--accent-trust); font-weight: 700; pointer-events: none; text-anchor: end; }

.edge-path { fill: none; transition: all var(--transition-fast); }
.edge-label { font-size: 9px; fill: var(--text-muted); pointer-events: none; }
.edge-path.animated { stroke-dasharray: 6 4; animation: flowDash 1s linear infinite; }
.edge-path.boot-active { stroke-dasharray: 8 4; animation: flowDash 0.6s linear infinite; }
@keyframes flowDash { to { stroke-dashoffset: -12; } }
.flow-particle { fill: var(--accent-lv3); filter: drop-shadow(0 0 6px currentColor); }

.canvas-controls {
  position: absolute; bottom: 16px; left: 16px;
  display: flex; flex-direction: column; gap: 4px; z-index: 5;
}
.canvas-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--text-secondary);
  background: rgba(26, 35, 50, 0.9); backdrop-filter: blur(8px);
  border: 1px solid var(--border-base); border-radius: 8px;
  cursor: pointer; transition: all var(--transition-fast);
}
.canvas-btn:hover { color: var(--accent-lv3); border-color: var(--accent-lv3); box-shadow: 0 0 10px var(--border-glow); }

.canvas-info {
  position: absolute; top: 16px; left: 16px;
  padding: 8px 14px; font-size: 12px; color: var(--text-secondary);
  background: rgba(26, 35, 50, 0.8); backdrop-filter: blur(8px);
  border: 1px solid var(--border-base); border-radius: 8px; z-index: 5;
}
.canvas-info strong { color: var(--accent-lv3); }

/* ============ 右侧详情面板 ============ */
.detail-panel {
  grid-area: detail;
  background: rgba(17, 24, 39, 0.6);
  backdrop-filter: blur(8px);
  border-left: 1px solid var(--border-base);
  padding: 16px; overflow-y: auto;
}
.detail-header {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 16px; padding-bottom: 12px;
  border-bottom: 1px solid var(--border-base);
}
.detail-icon {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px; font-size: 18px; font-weight: 700; flex-shrink: 0;
}
.detail-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
.detail-subtitle { font-size: 12px; color: var(--text-muted); }
.detail-section { margin-bottom: 16px; }
.detail-section-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 8px;
}
.detail-content { font-size: 13px; color: var(--text-primary); line-height: 1.6; }
.detail-list { list-style: none; padding: 0; }
.detail-list li {
  font-size: 12px; color: var(--text-secondary);
  padding: 4px 0; padding-left: 16px; position: relative;
}
.detail-list li::before { content: '▸'; position: absolute; left: 0; color: var(--accent-lv3); }
.detail-tag {
  display: inline-block; padding: 2px 8px; font-size: 11px; font-weight: 500;
  border-radius: 4px; margin: 2px;
}
.detail-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 100%; color: var(--text-muted); text-align: center; gap: 8px;
}
.detail-empty-icon { font-size: 32px; opacity: 0.4; }

/* ============ 底部时序控制条 ============ */
.timeline-bar {
  grid-area: timeline;
  display: flex; align-items: center; gap: 12px;
  padding: 0 20px;
  background: rgba(17, 24, 39, 0.9);
  backdrop-filter: blur(12px);
  border-top: 1px solid var(--border-base);
  z-index: 10;
}
.timeline-play {
  width: 44px; height: 44px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--bg-deep);
  background: linear-gradient(135deg, var(--accent-lv3), #0ea5e9);
  border: none; border-radius: 50%;
  cursor: pointer; transition: all var(--transition-fast);
  box-shadow: 0 2px 12px rgba(0, 240, 255, 0.3); flex-shrink: 0;
}
.timeline-play:hover { transform: scale(1.1); box-shadow: 0 4px 16px rgba(0, 240, 255, 0.5); }

.timeline-nav { display: flex; gap: 4px; flex-shrink: 0; align-items: center; }
.timeline-nav-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: var(--text-secondary);
  background: var(--bg-card); border: 1px solid var(--border-base);
  border-radius: 6px; cursor: pointer; transition: all var(--transition-fast);
}
.timeline-nav-btn:hover { color: var(--accent-lv3); border-color: var(--accent-lv3); }

.btn-next-step {
  padding: 0 18px; height: 40px;
  display: flex; align-items: center; gap: 6px;
  font-size: 14px; font-weight: 700;
  color: var(--bg-deep);
  background: linear-gradient(135deg, var(--accent-success), #16a34a);
  border: none; border-radius: 8px;
  cursor: pointer; transition: all var(--transition-fast);
  box-shadow: 0 2px 10px rgba(34, 197, 94, 0.35); flex-shrink: 0;
  letter-spacing: 1px;
}
.btn-next-step:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 14px rgba(34, 197, 94, 0.55);
  filter: brightness(1.1);
}
.btn-next-step:disabled {
  opacity: 0.4; cursor: not-allowed; transform: none;
}

.timeline-phases {
  flex: 1; display: flex; gap: 16px;
  overflow-x: auto; padding: 8px 6px;
}
.timeline-phase {
  display: flex; flex-direction: column; align-items: center;
  min-width: 175px; padding: 10px 18px;
  border-radius: 8px; cursor: pointer; transition: all var(--transition-fast);
  border: 1px solid transparent;
}
.timeline-phase:hover { background: var(--bg-hover); }
.timeline-phase.active { background: var(--bg-card); border-color: var(--border-glow); }
.phase-label { font-size: 16px; font-weight: 700; color: var(--text-secondary); white-space: nowrap; letter-spacing: 0.8px; }
.timeline-phase.active .phase-label { color: var(--text-primary); }

.phase-steps { display: flex; gap: 20px; margin-top: 14px; }
.phase-step-dot {
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--border-base);
  cursor: pointer; transition: all var(--transition-fast);
  border: 2px solid transparent;
}
.phase-step-dot.completed { background: var(--accent-success); }
.phase-step-dot.active {
  background: var(--accent-lv3);
  box-shadow: 0 0 14px var(--accent-lv3);
  transform: scale(1.4);
  border-color: rgba(255,255,255,0.4);
}
.phase-step-dot:hover { transform: scale(1.25); }

.timeline-speed { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); flex-shrink: 0; }
.timeline-speed select {
  padding: 4px 8px; font-size: 12px; color: var(--text-primary);
  background: var(--bg-card); border: 1px solid var(--border-base);
  border-radius: 6px; cursor: pointer;
}

/* ============ 改进1：启动步骤信息面板（右侧浮动，不遮挡画面） ============ */
.boot-step-info {
  position: absolute; top: 16px; right: 16px;
  width: 300px; max-height: calc(100% - 32px);
  padding: 16px 18px;
  background: rgba(17, 24, 39, 0.95); backdrop-filter: blur(16px);
  border: 1px solid var(--border-glow); border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 20px var(--border-glow);
  z-index: 20; animation: slideInRight 0.3s ease;
  overflow-y: auto;
}
@keyframes slideInRight {
  from { opacity: 0; transform: translateX(30px); }
  to { opacity: 1; transform: translateX(0); }
}
.boot-step-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.boot-step-id { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 4px; color: var(--bg-deep); }
.boot-step-participant { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.boot-step-action { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 8px; }
.boot-step-security {
  margin-top: 8px; padding: 8px 10px; font-size: 12px; color: var(--accent-trust);
  background: rgba(251, 191, 36, 0.08); border-radius: 8px;
  border-left: 3px solid var(--accent-trust);
}
.boot-step-security::before { content: '🔒 '; }
.boot-step-modules {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border-base);
}
.boot-step-modules-title {
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
  color: var(--text-muted); margin-bottom: 6px;
}
.boot-step-module-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.boot-step-module-tag {
  display: inline-block; padding: 2px 7px; font-size: 10px; font-weight: 500;
  border-radius: 4px; background: rgba(0, 240, 255, 0.1); color: var(--accent-lv3);
  border: 1px solid rgba(0, 240, 255, 0.2);
}

/* ============ Markdown 查看器 ============ */
.md-viewer-overlay {
  position: fixed; inset: 0;
  background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
  z-index: 100; display: none;
  align-items: center; justify-content: center;
}
.md-viewer-overlay.show { display: flex; }
.md-viewer {
  width: 90%; max-width: 920px; height: 85%;
  background: var(--bg-panel); border: 1px solid var(--border-base);
  border-radius: 16px; display: flex; flex-direction: column;
  overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}
.md-viewer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 24px; border-bottom: 1px solid var(--border-base);
}
.md-viewer-title { font-size: 16px; font-weight: 700; color: var(--text-primary); }
.md-viewer-close {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--text-secondary);
  background: var(--bg-card); border: 1px solid var(--border-base);
  border-radius: 8px; cursor: pointer; transition: all var(--transition-fast);
}
.md-viewer-close:hover { color: var(--accent-danger); border-color: var(--accent-danger); }
.md-viewer-body { flex: 1; overflow-y: auto; padding: 24px 32px; }
.md-viewer-body h1 { font-size: 24px; font-weight: 700; margin: 24px 0 16px; color: var(--text-primary); border-bottom: 2px solid var(--border-base); padding-bottom: 8px; }
.md-viewer-body h2 { font-size: 20px; font-weight: 600; margin: 20px 0 12px; color: var(--accent-lv3); border-bottom: 1px solid var(--border-base); padding-bottom: 6px; }
.md-viewer-body h3 { font-size: 16px; font-weight: 600; margin: 16px 0 8px; color: var(--accent-lv2); }
.md-viewer-body h4 { font-size: 14px; font-weight: 600; margin: 12px 0 6px; color: var(--accent-lv1); }
.md-viewer-body p { font-size: 14px; line-height: 1.7; color: var(--text-secondary); margin-bottom: 12px; }
.md-viewer-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
.md-viewer-body th { padding: 8px 12px; text-align: left; background: var(--bg-card); color: var(--text-primary); font-weight: 600; border: 1px solid var(--border-base); }
.md-viewer-body td { padding: 8px 12px; color: var(--text-secondary); border: 1px solid var(--border-base); }
.md-viewer-body code { font-family: 'Fira Code', 'Consolas', monospace; font-size: 13px; padding: 2px 6px; background: var(--bg-card); border-radius: 4px; color: var(--accent-lv3); }
.md-viewer-body pre { padding: 16px; background: var(--bg-deep); border: 1px solid var(--border-base); border-radius: 8px; overflow-x: auto; margin: 12px 0; }
.md-viewer-body pre code { padding: 0; background: none; color: var(--text-primary); }
.md-viewer-body strong { color: var(--text-primary); font-weight: 600; }
.md-viewer-body ul, .md-viewer-body ol { padding-left: 24px; margin-bottom: 12px; }
.md-viewer-body li { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
.md-viewer-body blockquote { border-left: 3px solid var(--accent-trust); padding-left: 12px; margin: 12px 0; color: var(--text-muted); font-style: italic; }
.md-viewer-body hr { border: none; border-top: 1px solid var(--border-base); margin: 20px 0; }

/* ============ 信任链覆盖层 ============ */
.trust-chain-overlay, .cluster-overlay {
  position: absolute; inset: 0;
  overflow-y: auto; z-index: 4;
  background: var(--bg-deep);
}
.trust-chain-container { padding: 32px 40px; }
.trust-chain-title {
  font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px;
  background: linear-gradient(135deg, var(--accent-trust), var(--accent-lv3));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.trust-chain-subtitle { font-size: 14px; text-align: center; color: var(--text-muted); margin-bottom: 28px; }
.trust-chain-flow { display: flex; align-items: center; justify-content: center; gap: 0; flex-wrap: wrap; margin-bottom: 32px; }
.trust-node {
  display: flex; flex-direction: column; align-items: center;
  padding: 18px 22px; border-radius: 16px; min-width: 180px;
  position: relative; transition: all var(--transition-smooth); cursor: pointer;
}
.trust-node:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3); }
.trust-node-icon { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 12px; margin-bottom: 12px; }
.trust-node-label { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
.trust-node-sublabel { font-size: 12px; color: var(--text-secondary); text-align: center; }
.trust-arrow { font-size: 24px; color: var(--accent-trust); padding: 0 8px; animation: arrowPulse 2s ease-in-out infinite; }
@keyframes arrowPulse {
  0%, 100% { opacity: 0.4; transform: translateX(0); }
  50% { opacity: 1; transform: translateX(4px); }
}
.trust-info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-top: 20px; }
.trust-info-card { padding: 16px; background: var(--bg-card); border: 1px solid var(--border-base); border-radius: 12px; transition: all var(--transition-fast); }
.trust-info-card:hover { border-color: var(--accent-trust); box-shadow: 0 0 16px rgba(251, 191, 36, 0.15); }
.trust-info-card h4 { font-size: 14px; font-weight: 600; color: var(--accent-trust); margin-bottom: 8px; }
.trust-info-card p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

/* ============ 改进3：集群位置视图 ============ */
.cluster-container { padding: 24px 32px; min-height: 100%; }
.cluster-title {
  font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 6px;
  background: linear-gradient(135deg, var(--accent-lv3), var(--accent-lv2), var(--accent-lv1));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.cluster-subtitle { font-size: 14px; text-align: center; color: var(--text-muted); margin-bottom: 28px; }

.cluster-external-bar {
  display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;
}
.cluster-ext-card {
  display: flex; flex-direction: column; align-items: center;
  padding: 14px 24px; border-radius: 12px; min-width: 180px;
  background: rgba(245, 158, 11, 0.08); border: 1px solid rgba(245, 158, 11, 0.3);
  transition: all var(--transition-smooth); cursor: pointer;
}
.cluster-ext-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.2); border-color: var(--accent-ext); }
.cluster-ext-icon { font-size: 28px; margin-bottom: 6px; }
.cluster-ext-name { font-size: 14px; font-weight: 700; color: var(--accent-ext); }
.cluster-ext-desc { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 2px; }

.cluster-connect-line {
  width: 2px; height: 28px; margin: 0 auto;
  background: linear-gradient(to bottom, var(--accent-ext), var(--accent-lv3));
  position: relative;
}
.cluster-connect-line::after {
  content: '↓ 远程证明'; position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  font-size: 11px; color: var(--text-muted); white-space: nowrap;
}

.cluster-level {
  margin: 0 auto 16px; padding: 20px 24px; border-radius: 16px;
  position: relative; transition: all var(--transition-smooth);
}
.cluster-level-3 {
  max-width: 720px;
  background: rgba(0, 240, 255, 0.06); border: 2px solid rgba(0, 240, 255, 0.3);
}
.cluster-level-2 {
  max-width: 900px;
  background: rgba(168, 85, 247, 0.06); border: 2px solid rgba(168, 85, 247, 0.3);
}
.cluster-level-1 {
  max-width: 900px;
  background: rgba(16, 185, 129, 0.06); border: 2px solid rgba(16, 185, 129, 0.3);
}
.cluster-level-header {
  display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
}
.cluster-level-badge {
  padding: 3px 10px; font-size: 12px; font-weight: 700; border-radius: 6px; color: var(--bg-deep);
}
.cluster-level-title { font-size: 16px; font-weight: 700; }
.cluster-level-role { font-size: 12px; color: var(--text-muted); margin-left: auto; }

.cluster-node-card {
  padding: 14px 18px; border-radius: 12px; margin-bottom: 10px;
  background: var(--bg-card); border: 1px solid var(--border-base);
  transition: all var(--transition-fast); cursor: pointer;
}
.cluster-node-card:hover { transform: translateX(4px); border-color: currentColor; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
.cluster-node-card.active { border-color: currentColor; box-shadow: 0 0 16px currentColor; }
.cluster-node-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.cluster-node-icon { font-size: 20px; }
.cluster-node-name { font-size: 14px; font-weight: 700; color: var(--text-primary); }
.cluster-node-spec { font-size: 12px; color: var(--text-secondary); margin-left: auto; }
.cluster-node-functions { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.cluster-func-tag {
  padding: 2px 8px; font-size: 10px; border-radius: 4px;
  background: rgba(255,255,255,0.05); color: var(--text-secondary);
}

.cluster-platforms-row { display: flex; gap: 14px; flex-wrap: wrap; }
.cluster-platform-col { flex: 1; min-width: 340px; }
.cluster-processors-row { display: flex; gap: 10px; margin-top: 10px; }
.cluster-processor-card {
  flex: 1; padding: 10px 14px; border-radius: 10px;
  background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.25);
  text-align: center; transition: all var(--transition-fast); cursor: pointer;
}
.cluster-processor-card:hover { transform: translateY(-2px); border-color: var(--accent-lv1); box-shadow: 0 4px 12px rgba(16,185,129,0.2); }
.cluster-processor-name { font-size: 13px; font-weight: 700; color: var(--accent-lv1); }
.cluster-processor-desc { font-size: 10px; color: var(--text-muted); margin-top: 3px; }

/* 跳转卡片样式 (点击跳转硬件架构) */
.cluster-jump-card { position: relative; }
.cluster-jump-card::after {
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: linear-gradient(135deg, transparent 40%, rgba(0,240,255,0.06) 100%);
  pointer-events: none; opacity: 0; transition: opacity var(--transition-fast);
}
.cluster-jump-card:hover::after { opacity: 1; }
.cluster-jump-card:hover {
  transform: translateY(-3px) scale(1.01);
  box-shadow: 0 6px 24px rgba(0,240,255,0.18), 0 0 0 1px rgba(0,240,255,0.3);
}
.cluster-jump-hint {
  margin-top: 8px; padding-top: 6px;
  font-size: 11px; font-weight: 600; color: var(--accent-lv3);
  border-top: 1px dashed rgba(0,240,255,0.2);
  text-align: right; letter-spacing: 0.5px;
}
.cluster-jump-hint-sm {
  margin-top: 6px; padding-top: 4px;
  font-size: 9px; font-weight: 600; color: var(--accent-lv1);
  border-top: 1px dashed rgba(16,185,129,0.25);
  letter-spacing: 0.3px;
}

.cluster-down-arrow {
  text-align: center; font-size: 20px; color: var(--text-muted); margin: 4px 0;
  animation: arrowBounce 2s ease-in-out infinite;
}
@keyframes arrowBounce {
  0%, 100% { transform: translateY(0); opacity: 0.4; }
  50% { transform: translateY(4px); opacity: 1; }
}
.cluster-arrow-label { font-size: 11px; color: var(--text-muted); text-align: center; margin: -4px 0 4px; }

.cluster-legend {
  display: flex; gap: 16px; justify-content: center; margin-top: 24px;
  padding: 12px 20px; background: var(--bg-card); border-radius: 10px;
  border: 1px solid var(--border-base);
}
.cluster-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.cluster-legend-dot { width: 10px; height: 10px; border-radius: 50%; }

/* ============ v6: Vera Rubin 集成视图 ============ */
.verarubin-overlay {
  position: absolute; inset: 0;
  overflow-y: auto; z-index: 4;
  background: var(--bg-deep);
}
/* v7: Vera Rubin 全屏模式 — 隐藏 sidebar/detail/timeline，overlay 占满 header 下方 */
body.vr-mode .sidebar,
body.vr-mode .detail-panel,
body.vr-mode .timeline-bar { display: none !important; }
body.vr-mode .verarubin-overlay {
  position: fixed;
  top: 56px; left: 0; right: 0; bottom: 0;
  z-index: 3;
  overflow: hidden;
}
.vr-container { padding: 12px 16px 12px; height: 100%; display: flex; flex-direction: column; min-height: 0; }
.vr-title {
  font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 4px;
  background: linear-gradient(135deg, #76b900, var(--accent-lv3), var(--accent-lv2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.vr-subtitle { font-size: 13px; text-align: center; color: var(--text-muted); margin-bottom: 12px; line-height: 1.6; }

/* v7: 双列布局 — 架构图 flex:1 + 说明栏固定 380px（用 flex 避免 grid+flex 冲突） */
.vr-layout {
  display: flex;
  gap: 14px;
  flex: 1; min-height: 0; width: 100%;
  align-items: stretch;
}
.vr-diagram-col { flex: 1 1 0; min-width: 0; }
.vr-info-col { flex: 0 0 460px; width: 460px; min-width: 0; }
.vr-diagram-col {
  background: var(--bg-card);
  border: 1px solid var(--border-base);
  border-radius: 12px;
  padding: 10px;
  display: flex; flex-direction: column;
  min-height: 0; overflow: hidden;
  position: relative;
}
.vr-diagram-title {
  font-size: 14px; font-weight: 700; color: var(--text-primary);
  margin-bottom: 4px; display: flex; align-items: center; gap: 8px;
}
.vr-diagram-title .vr-nvidia-dot { width: 10px; height: 10px; border-radius: 50%; background: #76b900; box-shadow: 0 0 8px #76b900; }
.vr-diagram-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
/* v7.2: 平面/立体视图切换标签 */
.vr-view-tabs { display: flex; gap: 6px; margin-bottom: 6px; }
.vr-view-tab {
  flex: 1; padding: 7px 10px; font-size: 12px; font-weight: 600;
  font-family: inherit; color: var(--text-secondary); cursor: pointer;
  background: var(--bg-deep); border: 1px solid var(--border-base); border-radius: 8px;
  transition: all 0.2s;
}
.vr-view-tab:hover { color: #76b900; border-color: #76b900; }
.vr-view-tab.active {
  color: var(--bg-deep); background: linear-gradient(135deg, #76b900, #22c55e);
  border-color: #76b900; box-shadow: 0 2px 10px rgba(118,185,0,0.3);
}
/* v8: 立体视图 — 信号流动动画（区别于静态模块）与引出线标注 */
.vr3-flow { stroke-dasharray: 9 7; animation: vr3flow 1.05s linear infinite; stroke-linecap: round; }
@keyframes vr3flow { to { stroke-dashoffset: -16; } }
.vr3-flow-particle { filter: drop-shadow(0 0 3px currentColor); }
.vr3-leader { fill: none; opacity: 0.8; }

/* v7: SVG 滚轮缩放 + 拖动平移 */
#vr-svg { width: 100%; flex: 1; min-height: 0; cursor: grab; display: block; }
#vr-svg.dragging { cursor: grabbing; }
#vr-svg .vr-module { cursor: grab; }
.vr-diagram-legend {
  display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px;
  padding: 6px 10px; background: var(--bg-deep); border-radius: 8px;
  border: 1px solid var(--border-base);
}
.vr-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-secondary); }
.vr-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
.vr-hint-bar {
  margin-top: 6px; padding: 5px 10px; font-size: 11px;
  background: rgba(0,240,255,0.06); border: 1px solid rgba(0,240,255,0.25);
  border-radius: 6px; color: var(--accent-lv3); text-align: center;
}
/* v7: SVG 缩放控制按钮 */
.vr-zoom-controls {
  position: absolute; bottom: 14px; right: 14px;
  display: flex; flex-direction: column; gap: 4px; z-index: 6;
}
.vr-zoom-btn {
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--text-secondary);
  background: rgba(26, 35, 50, 0.92); backdrop-filter: blur(8px);
  border: 1px solid var(--border-base); border-radius: 8px;
  cursor: pointer; transition: all var(--transition-fast);
}
.vr-zoom-btn:hover { color: var(--accent-lv3); border-color: var(--accent-lv3); box-shadow: 0 0 10px var(--border-glow); }
.vr-zoom-indicator {
  position: absolute; bottom: 14px; left: 14px; z-index: 6;
  padding: 4px 10px; font-size: 11px; font-weight: 600;
  color: var(--accent-lv3);
  background: rgba(26, 35, 50, 0.92); backdrop-filter: blur(8px);
  border: 1px solid var(--border-base); border-radius: 6px;
}

/* SVG 模块样式 */
.vr-module { cursor: default; transition: opacity 0.3s, filter 0.3s; }
.vr-module .vr-mod-rect { transition: all 0.3s; }
.vr-module.vr-active .vr-mod-rect { stroke-width: 3.5; filter: drop-shadow(0 0 14px currentColor); }
.vr-module.vr-highlight .vr-mod-rect { stroke-width: 2.5; filter: drop-shadow(0 0 8px currentColor); }
.vr-module.vr-dim { opacity: 0.18; }
.vr-edge { fill: none; transition: all 0.3s; }
.vr-edge.vr-edge-active { stroke-width: 3.5; filter: drop-shadow(0 0 6px currentColor); }
.vr-edge.vr-edge-dim { opacity: 0.12; }
.vr-edge-label { font-size: 9px; fill: var(--text-muted); pointer-events: none; }

/* 右侧内容列 — v7 独立滚动 */
.vr-info-col { display: flex; flex-direction: column; gap: 14px; min-width: 0; height: 100%; overflow-y: auto; padding-right: 4px; }
.vr-section {
  background: var(--bg-card); border: 1px solid var(--border-base);
  border-radius: 12px; padding: 0; min-width: 0; overflow: hidden; flex-shrink: 0;
}
/* v7.1: 右侧说明栏 — 点击标签展开（手风琴） */
.vr-sec-head {
  width: 100%; display: flex; align-items: center; gap: 8px;
  padding: 13px 16px; cursor: pointer; text-align: left;
  font-size: 15px; font-weight: 700; color: var(--text-primary);
  background: transparent; border: none; font-family: inherit;
  transition: background 0.2s;
}
.vr-sec-head:hover { background: rgba(118,185,0,0.07); }
.vr-section.open > .vr-sec-head {
  border-bottom: 1px solid var(--border-base);
  background: rgba(0,240,255,0.04);
}
.vr-sec-head .vr-section-num {
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
  width: 22px; height: 22px; border-radius: 6px; font-size: 12px;
  background: linear-gradient(135deg, #76b900, var(--accent-lv3)); color: var(--bg-deep); font-weight: 800;
}
.vr-sec-title { flex: 1; min-width: 0; }
.vr-sec-arrow { flex-shrink: 0; color: var(--text-muted); font-size: 12px; transition: transform 0.25s, color 0.25s; }
.vr-section.open .vr-sec-arrow { transform: rotate(180deg); color: #76b900; }
.vr-sec-body { display: none; padding: 14px 18px 16px; min-width: 0; max-height: 60vh; overflow-y: auto; overscroll-behavior: contain; }
.vr-section.open > .vr-sec-body { display: block; }
.vr-section p { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 8px; }
.vr-section p strong { color: var(--text-primary); }
.vr-section ul { padding-left: 18px; margin: 6px 0; }
.vr-section li { font-size: 12.5px; color: var(--text-secondary); line-height: 1.7; }
.vr-section li strong { color: var(--text-primary); }

/* 概况统计卡片 */
.vr-stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.vr-stat-card {
  padding: 10px 12px; border-radius: 8px;
  background: var(--bg-deep); border: 1px solid var(--border-base);
}
.vr-stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.vr-stat-value { font-size: 16px; font-weight: 700; color: #76b900; margin-top: 2px; }
.vr-stat-desc { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

/* 对应关系表 */
.vr-table { width: 100%; border-collapse: collapse; font-size: 12px; table-layout: fixed; word-break: break-word; }
.vr-table th, .vr-table td {
  padding: 8px 10px; text-align: left;
  border: 1px solid var(--border-base);
}
.vr-table th {
  background: var(--bg-deep); color: var(--accent-lv3);
  font-weight: 600; font-size: 11px;
}
.vr-table td { color: var(--text-secondary); }
.vr-table td strong { color: var(--text-primary); }
.vr-table tr:hover td { background: rgba(0,240,255,0.03); }

/* 整合方式卡片 */
.vr-integ-grid { display: flex; flex-direction: column; gap: 10px; }
.vr-integ-card {
  padding: 12px 14px; border-radius: 10px;
  border-left: 3px solid; background: var(--bg-deep);
}
.vr-integ-card.lv1 { border-left-color: var(--accent-lv1); }
.vr-integ-card.lv2 { border-left-color: var(--accent-lv2); }
.vr-integ-card.lv3 { border-left-color: var(--accent-lv3); }
.vr-integ-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.vr-integ-badge { padding: 2px 8px; font-size: 10px; font-weight: 700; border-radius: 4px; color: var(--bg-deep); }
.vr-integ-card.lv1 .vr-integ-badge { background: var(--accent-lv1); }
.vr-integ-card.lv2 .vr-integ-badge { background: var(--accent-lv2); }
.vr-integ-card.lv3 .vr-integ-badge { background: var(--accent-lv3); }
.vr-integ-title { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.vr-integ-card li { font-size: 12px; color: var(--text-secondary); line-height: 1.65; margin-top: 3px; }

/* 安全服务卡片（可交互高亮） */
.vr-service-card {
  padding: 14px 16px; border-radius: 10px; margin-bottom: 10px;
  background: var(--bg-deep); border: 1px solid var(--border-base);
  cursor: pointer; transition: all 0.25s; position: relative;
}
.vr-service-card:hover {
  border-color: var(--accent-trust);
  box-shadow: 0 4px 16px rgba(251,191,36,0.12);
  transform: translateX(2px);
}
.vr-service-card.active {
  border-color: var(--accent-trust);
  background: rgba(251,191,36,0.06);
  box-shadow: 0 0 0 1px var(--accent-trust), 0 6px 20px rgba(251,191,36,0.18);
}
.vr-service-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.vr-service-num {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 6px; font-size: 11px; font-weight: 800;
  background: var(--accent-trust); color: var(--bg-deep);
}
.vr-service-title { font-size: 14px; font-weight: 700; color: var(--text-primary); flex: 1; }
.vr-service-hint { font-size: 10px; color: var(--accent-trust); font-weight: 600; opacity: 0.7; }
.vr-service-card.active .vr-service-hint { opacity: 1; }
.vr-service-desc { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
.vr-service-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.vr-service-tag {
  padding: 2px 7px; font-size: 10px; border-radius: 4px;
  background: rgba(251,191,36,0.1); color: var(--accent-trust);
  border: 1px solid rgba(251,191,36,0.2);
}
.vr-service-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 8px; table-layout: fixed; word-break: break-word; }
.vr-service-table th, .vr-service-table td { padding: 5px 7px; border: 1px solid var(--border-base); text-align: left; }
.vr-service-table th { background: var(--bg-card); color: var(--accent-trust); font-weight: 600; }
.vr-service-table td { color: var(--text-secondary); }

/* 业务场景卡片 */
.vr-scenario-grid { display: flex; flex-direction: column; gap: 10px; }
.vr-scenario-card {
  padding: 12px 14px; border-radius: 10px;
  background: var(--bg-deep); border: 1px solid var(--border-base);
  border-left: 3px solid #76b900;
}
.vr-scenario-title { font-size: 13px; font-weight: 700; color: #76b900; margin-bottom: 6px; }
.vr-scenario-card li { font-size: 12px; color: var(--text-secondary); line-height: 1.65; margin-top: 3px; }
.vr-scenario-card li strong { color: var(--text-primary); }

/* 参考图折叠区 */
.vr-ref-collapse { margin-top: 4px; }
.vr-ref-toggle {
  width: 100%; padding: 10px 14px; text-align: left;
  background: var(--bg-deep); border: 1px solid var(--border-base);
  border-radius: 10px; cursor: pointer; color: var(--text-secondary);
  font-size: 13px; font-weight: 600; transition: all 0.2s;
  display: flex; align-items: center; justify-content: space-between;
}
.vr-ref-toggle:hover { border-color: #76b900; color: #76b900; }
.vr-ref-body { display: none; margin-top: 10px; }
.vr-ref-body.open { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.vr-ref-item {
  background: var(--bg-deep); border: 1px solid var(--border-base);
  border-radius: 8px; padding: 8px; cursor: pointer; transition: all 0.2s;
}
.vr-ref-item:hover { border-color: #76b900; box-shadow: 0 4px 14px rgba(118,185,0,0.18); transform: translateY(-2px); }
.vr-ref-item img { width: 100%; border-radius: 6px; display: block; }
.vr-ref-item .vr-ref-cap { font-size: 11px; color: var(--text-muted); margin-top: 6px; text-align: center; }
.vr-ref-item .vr-ref-zoom-hint { font-size: 9px; color: #76b900; text-align: center; margin-top: 2px; opacity: 0.7; }

/* v7: 图片放大 Lightbox */
.vr-lightbox {
  display: none; position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.92); backdrop-filter: blur(6px);
  align-items: center; justify-content: center; flex-direction: column;
  padding: 40px;
}
.vr-lightbox.open { display: flex; }
.vr-lightbox-img {
  max-width: 92vw; max-height: 80vh; border-radius: 8px;
  box-shadow: 0 0 40px rgba(118,185,0,0.25); object-fit: contain;
}
.vr-lightbox-cap {
  color: var(--text-secondary); font-size: 14px; margin-top: 16px; text-align: center;
}
.vr-lightbox-close {
  position: absolute; top: 20px; right: 24px;
  width: 40px; height: 40px; border-radius: 50%;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
  color: #fff; font-size: 24px; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; justify-content: center;
}

<!-- ============ 应用逻辑 ============ -->
<script>
(function () {
  'use strict';

  const D = window.VIZ_DATA;
  const { HARDWARE_NODES, HARDWARE_EDGES, BOOT_PHASES, BOOT_STEPS,
    TRUST_CHAIN, QUOTE_STRUCTURE, FAILURE_SCENARIOS,
    LEVEL_COLORS, EDGE_STYLES, CLUSTER_DATA } = D;

  // ============ 全局状态 ============
  const state = {
    view: 'architecture',
    selectedNodeId: null,
    activeStepIndex: -1,
    isPlaying: false,
    playSpeed: 2500,
    playTimer: null,
    zoom: 1, panX: 0, panY: 0,
    isDragging: false, dragStartX: 0, dragStartY: 0,
  };

  const SVG_W = 1500;
  const SVG_H = 1250;

  const $ = (sel) => document.querySelector(sel);
  const svg = () => $('#svg-canvas');

  // ============ 初始化 ============
  function init() {
    renderSidebar();
    bindEvents();
    renderArchitectureView();
    updateNextBtnState();
  }

  // ============ 事件绑定 ============
  function bindEvents() {
    document.querySelectorAll('.view-tab').forEach(tab => {
      tab.addEventListener('click', () => switchView(tab.dataset.view));
    });

    $('#btn-reset-view').addEventListener('click', resetView);
    $('#btn-zoom-in').addEventListener('click', () => zoomBy(1.2));
    $('#btn-zoom-out').addEventListener('click', () => zoomBy(0.8));
    $('#btn-doc').addEventListener('click', toggleDocViewer);
    $('#md-close').addEventListener('click', toggleDocViewer);
    $('#md-viewer-overlay').addEventListener('click', (e) => {
      if (e.target.id === 'md-viewer-overlay') toggleDocViewer();
    });

    $('#btn-play').addEventListener('click', togglePlay);
    $('#btn-prev').addEventListener('click', () => stepTo(state.activeStepIndex - 1));
    $('#btn-next').addEventListener('click', () => stepTo(state.activeStepIndex + 1));
    $('#speed-select').addEventListener('change', (e) => {
      state.playSpeed = parseInt(e.target.value);
      if (state.isPlaying) { stopPlay(); startPlay(); }
    });

    const s = svg();
    s.addEventListener('mousedown', onSvgMouseDown);
    window.addEventListener('mousemove', onSvgMouseMove);
    window.addEventListener('mouseup', onSvgMouseUp);
    s.addEventListener('wheel', onSvgWheel, { passive: false });
  }

  // ============ 视图切换 ============
  function switchView(view) {
    state.view = view;
    document.querySelectorAll('.view-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.view === view);
    });

    const timelineBar = $('.timeline-bar');
    const tcOverlay = $('#trust-chain-overlay');
    const clusterOverlay = $('#cluster-overlay');
    const svgEl = $('#svg-canvas');
    const canvasInfo = $('#canvas-info');
    const canvasControls = $('.canvas-controls');
    const bootStepInfo = $('#boot-step-info');

    // 隐藏所有覆盖层
    if (tcOverlay) tcOverlay.style.display = 'none';
    if (clusterOverlay) clusterOverlay.style.display = 'none';
    const vrOverlay = $('#verarubin-overlay');
    if (vrOverlay) vrOverlay.style.display = 'none';
    if (bootStepInfo) bootStepInfo.style.display = 'none';

    // v7: Vera Rubin 全屏模式 class 管理
    document.body.classList.toggle('vr-mode', view === 'verarubin');

    if (view === 'architecture' || view === 'boot') {
      timelineBar.style.display = 'flex';
      if (svgEl) svgEl.style.display = '';
      if (canvasInfo) canvasInfo.style.display = '';
      if (canvasControls) canvasControls.style.display = '';
      clearSelection();
      if (view === 'architecture') {
        renderArchitectureView();
      } else {
        renderBootView();
      }
    } else if (view === 'trustchain') {
      timelineBar.style.display = 'none';
      if (svgEl) svgEl.style.display = 'none';
      if (canvasInfo) canvasInfo.style.display = 'none';
      if (canvasControls) canvasControls.style.display = 'none';
      if (tcOverlay) {
        tcOverlay.style.display = 'block';
        renderTrustChainView();
      }
    } else if (view === 'cluster') {
      timelineBar.style.display = 'none';
      if (svgEl) svgEl.style.display = 'none';
      if (canvasInfo) canvasInfo.style.display = 'none';
      if (canvasControls) canvasControls.style.display = 'none';
      if (clusterOverlay) {
        clusterOverlay.style.display = 'block';
        renderClusterView();
      }
    } else if (view === 'verarubin') {
      // v7: sidebar/detail/timeline 由 body.vr-mode CSS 隐藏
      if (svgEl) svgEl.style.display = 'none';
      if (canvasInfo) canvasInfo.style.display = 'none';
      if (canvasControls) canvasControls.style.display = 'none';
      if (vrOverlay) {
        vrOverlay.style.display = 'block';
        renderVeraRubinView();
      }
    }
  }

  // ============ 左侧导航 ============
  function renderSidebar() {
    const container = $('#sidebar-nav');
    const levels = [
      { level: 3, label: '三级可信根', nodes: HARDWARE_NODES.filter(n => n.level === 3) },
      { level: 2, label: '二级可信根', nodes: HARDWARE_NODES.filter(n => n.level === 2) },
      { level: 1, label: '一级可信根', nodes: HARDWARE_NODES.filter(n => n.level === 1).concat(HARDWARE_NODES.filter(n => n.id === 'ext-sdcard')) },
      { level: 0, label: '外部可信第三方', nodes: HARDWARE_NODES.filter(n => n.level === 0 && n.id !== 'ext-comm' && n.id !== 'ext-sdcard') },
      { level: 0, label: '通信硬件', nodes: HARDWARE_NODES.filter(n => n.id === 'ext-comm') },
    ];

    let html = '';
    levels.forEach(({ level, label, nodes }) => {
      const color = LEVEL_COLORS[level];
      html += `<div class="nav-group">`;
      html += `<div class="nav-group-header"><span class="nav-dot" style="background:${color.primary}"></span>${label}</div>`;
      html += `<div class="nav-children">`;
      nodes.forEach(node => {
        if (node.type === 'soc' || node.type === 'external') {
          html += `<div class="nav-item" data-node-id="${node.id}">${node.label.replace(/\n/g, ' ')}</div>`;
        }
      });
      html += `</div></div>`;
    });

    html += `<div class="nav-group">
      <div class="nav-group-header"><span class="nav-dot" style="background:${LEVEL_COLORS[0].primary}"></span>故障场景</div>
      <div class="nav-children">
        <div class="nav-item" data-action="failures">查看失败处理策略 (${FAILURE_SCENARIOS.length})</div>
      </div>
    </div>`;

    container.innerHTML = html;

    container.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', () => {
        if (item.dataset.action === 'failures') {
          showFailureScenarios();
        } else if (item.dataset.nodeId) {
          selectNode(item.dataset.nodeId);
        }
      });
    });
  }

  // ============ 硬件架构视图 ============
  function renderArchitectureView() {
    const s = svg();
    s.innerHTML = '';

    const defs = createSVGElement('defs', {});
    defs.innerHTML = `
      <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="bgGlow3"><stop offset="0%" stop-color="${LEVEL_COLORS[3].primary}" stop-opacity="0.06"/><stop offset="100%" stop-color="${LEVEL_COLORS[3].primary}" stop-opacity="0"/></radialGradient>
      <radialGradient id="bgGlow2"><stop offset="0%" stop-color="${LEVEL_COLORS[2].primary}" stop-opacity="0.06"/><stop offset="100%" stop-color="${LEVEL_COLORS[2].primary}" stop-opacity="0"/></radialGradient>
      <radialGradient id="bgGlow1"><stop offset="0%" stop-color="${LEVEL_COLORS[1].primary}" stop-opacity="0.06"/><stop offset="100%" stop-color="${LEVEL_COLORS[1].primary}" stop-opacity="0"/></radialGradient>
    `;
    s.appendChild(defs);

    const mainG = createSVGElement('g', { id: 'main-group' });
    s.appendChild(mainG);

    // 层级背景光晕
    mainG.appendChild(createSVGElement('rect', { x: 20, y: 40, width: 1060, height: 320, fill: 'url(#bgGlow3)', rx: 16 }));
    mainG.appendChild(createSVGElement('rect', { x: 20, y: 470, width: 1060, height: 250, fill: 'url(#bgGlow2)', rx: 16 }));
    mainG.appendChild(createSVGElement('rect', { x: 20, y: 710, width: 1060, height: 490, fill: 'url(#bgGlow1)', rx: 16 }));

    // 层级标签 (紧贴各自SOC外框上方)
    const levelLabels = [
      { y: 42, text: '三级可信根 — OpenTitan SoC (集群管理平台 / VCU129)', color: LEVEL_COLORS[3].primary },
      { y: 482, text: '二级可信根 — Zynq MPSoC (计算平台 / ZCU104)', color: LEVEL_COLORS[2].primary },
      { y: 722, text: '一级可信根 — Caliptra + 主CPU (异构处理器芯片)', color: LEVEL_COLORS[1].primary },
    ];
    levelLabels.forEach(lbl => {
      const t = createSVGElement('text', {
        x: 40, y: lbl.y, fill: lbl.color,
        'font-size': 14, 'font-weight': 700, 'font-family': 'Inter, sans-serif'
      });
      t.textContent = lbl.text;
      mainG.appendChild(t);
    });

    // 绘制边（先画边再画节点）
    HARDWARE_EDGES.forEach(edge => drawEdge(mainG, edge));
    // 绘制节点
    HARDWARE_NODES.forEach(node => drawNode(mainG, node));

    updateCanvasInfo('硬件架构视图', '点击节点查看详情 · 滚轮缩放 · 拖拽平移');
    resetView();
  }

  function drawNode(parent, node) {
    const color = LEVEL_COLORS[node.level];
    const g = createSVGElement('g', {
      class: 'node-group',
      'data-node-id': node.id,
      transform: `translate(${node.x}, ${node.y})`
    });

    const isContainer = node.type === 'soc' || node.type === 'external' || node.type === 'container';
    const isSoftware = node.type === 'software';
    const strokeWidth = isContainer ? 2 : 1.5;
    const fillOpacity = isContainer ? 0.04 : (isSoftware ? 0.12 : 0.08);
    const nodeColor = isSoftware ? '#f59e0b' : color.primary;
    const dashArray = isContainer ? '6 4' : (isSoftware ? '3 2' : 'none');

    // 添加类型class
    if (node.type === 'software') g.classList.add('software');
    if (node.type === 'container') g.classList.add('container');
    if (node.cpu) g.classList.add('cpu');

    const rect = createSVGElement('rect', {
      class: 'node-rect',
      width: node.w, height: node.h,
      rx: isContainer ? 12 : (isSoftware ? 6 : 8),
      fill: nodeColor,
      'fill-opacity': fillOpacity,
      stroke: nodeColor,
      'stroke-width': strokeWidth,
      'stroke-dasharray': dashArray,
    });
    rect.style.color = nodeColor;
    g.appendChild(rect);

    const labelLines = node.label.split('\n');
    const labelY = isContainer ? 24 : (node.h / 2 - (labelLines.length - 1) * 7);
    labelLines.forEach((line, i) => {
      const t = createSVGElement('text', {
        class: 'node-label',
        x: node.w / 2,
        y: labelY + i * 14,
        fill: isContainer ? nodeColor : (isSoftware ? '#f59e0b' : '#e2e8f0'),
        'font-size': isContainer ? 13 : (isSoftware ? 10 : 11),
        'font-weight': isContainer ? 700 : 600,
      });
      t.textContent = line;
      g.appendChild(t);
    });

    if (isContainer && node.role) {
      const role = createSVGElement('text', {
        x: node.w / 2, y: node.h - 10,
        class: 'node-sublabel',
        fill: '#64748b', 'font-size': 10
      });
      role.textContent = node.role.length > 45 ? node.role.substring(0, 45) + '...' : node.role;
      g.appendChild(role);
    }

    // CPU核心节点添加角标
    if (node.cpu) {
      const badge = createSVGElement('text', {
        x: node.w - 6, y: 12,
        class: 'node-cpu-badge',
      });
      badge.textContent = '⚡CPU';
      g.appendChild(badge);
    }

    g.addEventListener('click', (e) => {
      e.stopPropagation();
      selectNode(node.id);
    });

    parent.appendChild(g);
  }

  function drawEdge(parent, edge) {
    const src = HARDWARE_NODES.find(n => n.id === edge.source);
    const tgt = HARDWARE_NODES.find(n => n.id === edge.target);
    if (!src || !tgt) return;

    const style = EDGE_STYLES[edge.type] || EDGE_STYLES.internal;
    const wps = edge.waypoints;

    let sx, sy, ex, ey, pathD, labelX, labelY;

    if (wps && wps.length > 0) {
      // 带waypoint的路由：起点朝第一个waypoint，终点从最后一个waypoint
      const firstWp = wps[0];
      const lastWp = wps[wps.length - 1];
      const sp = adjustEdgePoint(src, firstWp.x, firstWp.y);
      const ep = adjustEdgePoint(tgt, lastWp.x, lastWp.y);
      sx = sp.x; sy = sp.y; ex = ep.x; ey = ep.y;
      pathD = `M ${sx} ${sy}`;
      wps.forEach(wp => { pathD += ` L ${wp.x} ${wp.y}`; });
      pathD += ` L ${ex} ${ey}`;
      // 标签放在中间waypoint附近
      const midWp = wps[Math.floor(wps.length / 2)];
      labelX = midWp.x; labelY = midWp.y;
    } else {
      // 直线连接
      const sp = adjustEdgePoint(src, tgt.x + tgt.w / 2, tgt.y + tgt.h / 2);
      const ep = adjustEdgePoint(tgt, src.x + src.w / 2, src.y + src.h / 2);
      sx = sp.x; sy = sp.y; ex = ep.x; ey = ep.y;
      pathD = `M ${sx} ${sy} L ${ex} ${ey}`;
      labelX = (sx + ex) / 2; labelY = (sy + ey) / 2;
    }

    const path = createSVGElement('path', {
      class: 'edge-path' + (edge.animated ? ' animated' : ''),
      d: pathD,
      stroke: style.color,
      'stroke-width': style.width,
      'stroke-dasharray': style.dash === 'none' ? undefined : style.dash,
      'data-edge-id': edge.id,
      fill: 'none',
    });
    parent.appendChild(path);

    if (edge.label) {
      const labelText = edge.label.length > 28 ? edge.label.substring(0, 28) + '...' : edge.label;
      const label = createSVGElement('text', {
        x: labelX, y: labelY - 4,
        class: 'edge-label',
        'text-anchor': 'middle',
        fill: '#94a3b8', 'font-size': 10,
      });
      label.textContent = labelText;
      const bgRect = createSVGElement('rect', {
        x: labelX - labelText.length * 3.2 - 4,
        y: labelY - 13,
        width: labelText.length * 6.4 + 8,
        height: 15,
        rx: 3,
        fill: '#0a0e1a',
        'fill-opacity': 0.85,
      });
      parent.appendChild(bgRect);
      parent.appendChild(label);
    }
  }

  function adjustEdgePoint(node, targetX, targetY) {
    const cx = node.x + node.w / 2;
    const cy = node.y + node.h / 2;
    const dx = targetX - cx;
    const dy = targetY - cy;
    if (dx === 0 && dy === 0) return { x: cx, y: cy };
    const angle = Math.atan2(dy, dx);
    const halfW = node.w / 2;
    const halfH = node.h / 2;
    const cos = Math.cos(angle);
    const sin = Math.sin(angle);
    const tX = Math.abs(cos) > 0.001 ? halfW / Math.abs(cos) : Infinity;
    const tY = Math.abs(sin) > 0.001 ? halfH / Math.abs(sin) : Infinity;
    const t = Math.min(tX, tY);
    return { x: cx + cos * t, y: cy + sin * t };
  }

  // ============ 节点选中 ============
  function selectNode(nodeId) {
    state.selectedNodeId = nodeId;
    const node = HARDWARE_NODES.find(n => n.id === nodeId);
    if (!node) return;

    document.querySelectorAll('.node-group').forEach(g => {
      g.classList.remove('active', 'dimmed', 'highlighted');
      if (g.dataset.nodeId === nodeId) {
        g.classList.add('active');
      } else {
        g.classList.add('dimmed');
      }
    });

    document.querySelectorAll('.edge-path').forEach(p => {
      const edge = HARDWARE_EDGES.find(e => e.id === p.dataset.edgeId);
      if (!edge) return;
      if (edge.source === nodeId || edge.target === nodeId) {
        p.style.opacity = 1;
        p.style.strokeWidth = '3';
        const relatedId = edge.source === nodeId ? edge.target : edge.source;
        const relatedG = document.querySelector(`.node-group[data-node-id="${relatedId}"]`);
        if (relatedG) relatedG.classList.add('highlighted');
      } else {
        p.style.opacity = 0.2;
      }
    });

    renderDetailPanel(node);
    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.toggle('active', item.dataset.nodeId === nodeId);
    });
  }

  function clearSelection() {
    state.selectedNodeId = null;
    document.querySelectorAll('.node-group').forEach(g => {
      g.classList.remove('active', 'dimmed', 'highlighted');
    });
    document.querySelectorAll('.edge-path').forEach(p => {
      p.style.opacity = '';
      p.style.strokeWidth = '';
    });
    renderDetailPanel(null);
  }

  // ============ 详情面板 ============
  function renderDetailPanel(node) {
    const panel = $('#detail-panel');
    if (!node) {
      panel.innerHTML = `
        <div class="detail-empty">
          <div class="detail-empty-icon">🖥</div>
          <div>点击硬件组件查看详情</div>
          <div style="font-size:12px">支持缩放、平移、点击交互</div>
        </div>`;
      return;
    }

    const color = LEVEL_COLORS[node.level];
    const phaseTags = (node.bootPhases || []).map(p => {
      const phase = BOOT_PHASES.find(ph => ph.id === p);
      return `<span class="detail-tag" style="background:${phase.color}22;color:${phase.color}">${phase.icon} ${phase.label}</span>`;
    }).join('');

    const funcList = (node.functions || []).map(f => `<li>${f}</li>`).join('');
    const secList = (node.security || []).map(s => `<li>${s}</li>`).join('');
    const ifaceList = (node.interfaces || []).map(i => `<span class="detail-tag" style="background:var(--bg-hover);color:var(--text-secondary)">${i}</span>`).join('');

    panel.innerHTML = `
      <div class="detail-header">
        <div class="detail-icon" style="background:${color.primary}22;color:${color.primary}">
          ${LEVEL_COLORS[node.level].name.charAt(0)}
        </div>
        <div>
          <div class="detail-title">${node.label.replace(/\n/g, ' ')}</div>
          <div class="detail-subtitle">${LEVEL_COLORS[node.level].name}可信根 · ${node.type}</div>
        </div>
      </div>
      ${node.spec ? `<div class="detail-section"><div class="detail-section-title">规格</div><div class="detail-content">${node.spec}</div></div>` : ''}
      ${node.role ? `<div class="detail-section"><div class="detail-section-title">系统角色</div><div class="detail-content">${node.role}</div></div>` : ''}
      ${funcList ? `<div class="detail-section"><div class="detail-section-title">核心职能</div><ul class="detail-list">${funcList}</ul></div>` : ''}
      ${ifaceList ? `<div class="detail-section"><div class="detail-section-title">接口</div><div>${ifaceList}</div></div>` : ''}
      ${secList ? `<div class="detail-section"><div class="detail-section-title">安全特性</div><ul class="detail-list">${secList}</ul></div>` : ''}
      ${phaseTags ? `<div class="detail-section"><div class="detail-section-title">参与启动阶段</div><div>${phaseTags}</div></div>` : ''}
      ${node.docRef ? `<div class="detail-section"><div class="detail-section-title">文档参考</div><div class="detail-content" style="color:var(--accent-lv3);font-family:monospace">system_top3.md §${node.docRef}</div></div>` : ''}
    `;
  }

  // ============ 启动流程视图 ============
  function renderBootView() {
    const s = svg();
    s.innerHTML = '';

    const defs = createSVGElement('defs', {});
    defs.innerHTML = `
      <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="bgGlow3"><stop offset="0%" stop-color="${LEVEL_COLORS[3].primary}" stop-opacity="0.06"/><stop offset="100%" stop-color="${LEVEL_COLORS[3].primary}" stop-opacity="0"/></radialGradient>
      <radialGradient id="bgGlow2"><stop offset="0%" stop-color="${LEVEL_COLORS[2].primary}" stop-opacity="0.06"/><stop offset="100%" stop-color="${LEVEL_COLORS[2].primary}" stop-opacity="0"/></radialGradient>
      <radialGradient id="bgGlow1"><stop offset="0%" stop-color="${LEVEL_COLORS[1].primary}" stop-opacity="0.06"/><stop offset="100%" stop-color="${LEVEL_COLORS[1].primary}" stop-opacity="0"/></radialGradient>
    `;
    s.appendChild(defs);

  // ============ 时序控制条 ============
  function renderTimeline() {
    const container = $('#timeline-phases');
    let html = '';

    BOOT_PHASES.forEach(phase => {
      const phaseSteps = BOOT_STEPS.filter(s => s.phase === phase.id);
      const dots = phaseSteps.map((step) => {
        const stepIdx = BOOT_STEPS.indexOf(step);
        let dotClass = 'phase-step-dot';
        if (stepIdx < state.activeStepIndex) dotClass += ' completed';
        if (stepIdx === state.activeStepIndex) dotClass += ' active';
        return `<div class="${dotClass}" data-step-idx="${stepIdx}" title="${step.subId}: ${step.action.substring(0, 60)}..."></div>`;
      }).join('');

      html += `
        <div class="timeline-phase ${state.activeStepIndex >= 0 && BOOT_STEPS[state.activeStepIndex]?.phase === phase.id ? 'active' : ''}" data-phase="${phase.id}">
          <div class="phase-label">${phase.icon} ${phase.label}</div>
          <div class="phase-steps">${dots}</div>
        </div>`;
    });

    container.innerHTML = html;

    container.querySelectorAll('.phase-step-dot').forEach(dot => {
      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        stepTo(parseInt(dot.dataset.stepIdx));
      });
    });

    container.querySelectorAll('.timeline-phase').forEach(p => {
      p.addEventListener('click', (e) => {
        if (!e.target.classList.contains('phase-step-dot')) {
          const phaseId = p.dataset.phase;
          const firstStep = BOOT_STEPS.findIndex(s => s.phase === phaseId);
          if (firstStep >= 0) stepTo(firstStep);
        }
      });
    });
  }

  // ============ 播放控制 ============
  function togglePlay() {
    if (state.isPlaying) {
      stopPlay();
    } else {
      if (state.activeStepIndex < 0 || state.activeStepIndex >= BOOT_STEPS.length - 1) {
        state.activeStepIndex = -1;
      }
      startPlay();
    }
  }

  function startPlay() {
    state.isPlaying = true;
    $('#btn-play').textContent = '⏸';
    if (state.view !== 'boot') switchView('boot');

    if (state.activeStepIndex < 0) {
      stepTo(0);
    }

    state.playTimer = setInterval(() => {
      const next = state.activeStepIndex + 1;
      if (next >= BOOT_STEPS.length) {
        stopPlay();
        return;
      }
      stepTo(next);
    }, state.playSpeed);
  }

  function stopPlay() {
    state.isPlaying = false;
    $('#btn-play').textContent = '▶';
    if (state.playTimer) {
      clearInterval(state.playTimer);
      state.playTimer = null;
    }
  }

  function stepTo(index) {
    if (index < 0 || index >= BOOT_STEPS.length) {
      updateNextBtnState();
      return;
    }
    state.activeStepIndex = index;
    highlightBootStep(index);
    renderTimeline();
    updateBootStepInfo(BOOT_STEPS[index]);
    updateNextBtnState();
  }

  function updateNextBtnState() {
    const btn = $('#btn-next');
    if (!btn) return;
    if (state.activeStepIndex >= BOOT_STEPS.length - 1) {
      btn.disabled = true;
      btn.textContent = '已完成 ✓';
    } else {
      btn.disabled = false;
      btn.textContent = '下一步 ▶';
    }
  }

  // ============ 改进4：启动步骤高亮（高亮所有涉及节点和边） ============
  // ============ 计算信号路径方向（根据sourceNodeId/targetNodeId推断流向） ============
  function computeSignalPath(step) {
    const edges = step.involvedEdges || [];
    const src = step.sourceNodeId;
    const tgt = step.targetNodeId;
    const result = [];

    edges.forEach(eId => {
      const edge = HARDWARE_EDGES.find(e => e.id === eId);
      if (!edge) return;
      let from = edge.source;
      let to = edge.target;
      // 优先：信号从sourceNodeId流出
      if (src && edge.source === src) { from = edge.source; to = edge.target; }
      else if (src && edge.target === src) { from = edge.target; to = edge.source; }
      // 其次：信号流向targetNodeId
      else if (tgt && edge.target === tgt) { from = edge.source; to = edge.target; }
      else if (tgt && edge.source === tgt) { from = edge.target; to = edge.source; }
      result.push({ edge: edge, from: from, to: to });
    });
    return result;
  }

  function highlightBootStep(index) {
    const step = BOOT_STEPS[index];
    if (!step) return;

    const phaseColor = BOOT_PHASES.find(ph => ph.id === step.phase).color;
    const involvedNodes = step.involvedNodes || [];
    const involvedEdges = step.involvedEdges || [];

    // 重置所有节点
    document.querySelectorAll('.node-group').forEach(g => {
      g.classList.remove('active', 'highlighted', 'dimmed');
    });

    // 重置所有边
    document.querySelectorAll('.edge-path').forEach(p => {
      p.classList.remove('boot-active');
      p.style.opacity = '';
      p.style.strokeWidth = '';
      p.style.stroke = '';
    });

    // 移除旧的粒子
    document.querySelectorAll('.flow-particle').forEach(p => p.remove());

    // 高亮涉及的节点 (使用.node-group限定SVG节点，避免匹配侧边栏div)
    involvedNodes.forEach(nodeId => {
      const g = document.querySelector(`.node-group[data-node-id="${nodeId}"]`);
      if (g) {
        if (nodeId === step.sourceNodeId) {
          g.classList.add('active');
        } else {
          g.classList.add('highlighted');
        }
      }
    });

    // 非涉及节点变暗
    document.querySelectorAll('.node-group').forEach(g => {
      if (!g.classList.contains('active') && !g.classList.contains('highlighted')) {
        g.classList.add('dimmed');
      }
    });

    // 非涉及边变暗（只高亮与当前步骤相关的路径）
    document.querySelectorAll('.edge-path').forEach(p => {
      if (!involvedEdges.includes(p.dataset.edgeId)) {
        p.style.opacity = 0.12;
      }
    });

    // 高亮涉及的边并添加流动粒子
    const signalPath = computeSignalPath(step);
    signalPath.forEach((sp, idx) => {
      const p = document.querySelector(`[data-edge-id="${sp.edge.id}"]`);
      if (p) {
        p.style.opacity = 1;
        p.style.strokeWidth = '3.5';
        p.style.stroke = phaseColor;
        p.classList.add('boot-active');
      }
      // 在所有涉及边上添加流动粒子（方向由computeSignalPath决定，按顺序延迟启动）
      addFlowParticle(sp.edge, sp.from, sp.to, phaseColor, idx * 0.4);
    });
  }

  function addFlowParticle(edge, fromId, toId, color, delay) {
    const fromNode = HARDWARE_NODES.find(n => n.id === fromId);
    const toNode = HARDWARE_NODES.find(n => n.id === toId);
    if (!fromNode || !toNode) return;

    const mainG = $('#main-group');
    if (!mainG) return;

    // 根据方向决定waypoint顺序
    const wps = edge.waypoints || [];
    const orderedWps = (fromId === edge.source) ? wps : [...wps].reverse();

    // 计算起点（从fromNode朝第一个waypoint或toNode）
    const firstTarget = orderedWps.length > 0 ? orderedWps[0] : { x: toNode.x + toNode.w / 2, y: toNode.y + toNode.h / 2 };
    const { x: x1, y: y1 } = adjustEdgePoint(fromNode, firstTarget.x, firstTarget.y);

    // 计算终点（从toNode朝最后一个waypoint或fromNode）
    const lastTarget = orderedWps.length > 0 ? orderedWps[orderedWps.length - 1] : { x: fromNode.x + fromNode.w / 2, y: fromNode.y + fromNode.h / 2 };
    const { x: x2, y: y2 } = adjustEdgePoint(toNode, lastTarget.x, lastTarget.y);

    // 构建路径
    let pathD = `M ${x1} ${y1}`;
    orderedWps.forEach(wp => { pathD += ` L ${wp.x} ${wp.y}`; });
    pathD += ` L ${x2} ${y2}`;

    const particle = createSVGElement('circle', {
      class: 'flow-particle',
      r: 5,
      fill: color,
      style: `filter: drop-shadow(0 0 8px ${color})`,
    });
    const animateMotion = createSVGElement('animateMotion', {
      dur: '1.8s',
      repeatCount: 'indefinite',
      path: pathD,
      begin: (delay || 0) + 's',
    });
    particle.appendChild(animateMotion);
    mainG.appendChild(particle);
  }

  // ============ 渲染 Vera Rubin 集成 SVG 架构图 ============

        fill: color, 'fill-opacity': opts.fillOpacity != null ? opts.fillOpacity : 0.08,
        stroke: color, 'stroke-width': opts.strokeWidth || 1.5,
        'stroke-dasharray': opts.dash || 'none'

      const t = el('text', { x: x + w / 2, y: y + (opts.titleY || 22), 'text-anchor': 'middle', 'font-size': opts.titleSize || 12, 'font-weight': 700, fill: color });
      t.textContent = title;
      const children = [rect, t];

        const s = el('text', { x: x + w / 2, y: y + (opts.subY || 38), 'text-anchor': 'middle', 'font-size': opts.subSize || 9, fill: '#94a3b8' });
        // 支持 \n 换行
