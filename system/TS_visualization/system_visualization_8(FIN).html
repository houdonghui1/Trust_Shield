  // ============ v8: 立体机柜视图（等轴测 · 多形状部件 · 引出线标注 · 动态信号流） ============
  let vrDiagramMode = 'flat';

  function switchVrDiagram(mode) {
    if (mode === vrDiagramMode) return;
    vrDiagramMode = mode;
    const tabFlat = $('#vr-tab-flat');
    const tab3d = $('#vr-tab-3d');
    const sub = $('#vr-diagram-sub');
    const hint = $('#vr-hint-bar');
    if (tabFlat) tabFlat.classList.toggle('active', mode === 'flat');
    if (tab3d) tab3d.classList.toggle('active', mode === '3d');
    clearVeraHighlight();
    document.querySelectorAll('.vr-service-card').forEach(c => c.classList.remove('active'));
    if (mode === '3d') {
      renderVera3DRack();
      if (sub) sub.textContent = '立体视图 · 集群层 → 机架层 → 托盘层 → 芯片层 · 引出线标注部件名称 · 发光流动线为信号路径';
      if (hint) hint.textContent = '🧊 立体视图：27 层托盘显示 14 层 · GPU/CPU 片内集成 Caliptra · 滚轮缩放 · 拖动平移';
    } else {
      renderVeraRubinSvg();
      if (sub) sub.textContent = '体现集群 → 机架 → 计算托盘 → 芯片 的结构层次 · 滚轮缩放 · 拖动平移';
      if (hint) hint.textContent = '👆 点击右侧"安全服务"卡片，相关模块将在此图中高亮';
    }
    renderVeraLegend(mode);
    resetVrView();
  }

  function renderVera3DRack() {
    const svg = $('#vr-svg');
    if (!svg) return;
    svg.innerHTML = '';

    const ns = 'http://www.w3.org/2000/svg';
    const l3Color = LEVEL_COLORS[3].primary;
    const l2Color = LEVEL_COLORS[2].primary;
    const l1Color = LEVEL_COLORS[1].primary;
    const nvGreen = '#76b900';
    const nvPurple = '#8b5cf6';
    const swColor = '#22d3ee';
    const extColor = '#f59e0b';

    const el = (tag, attrs) => {
      const e = document.createElementNS(ns, tag);
      for (const k in attrs) e.setAttribute(k, attrs[k]);
      return e;
    };

    // defs：彩色箭头 + 球体高光渐变
    const defs = el('defs', {});
    const mkMarker = (id, color) => {
      // v8.2: 固定像素尺寸的小箭头（不随线宽放大）
      const m = el('marker', { id, markerUnits: 'userSpaceOnUse', markerWidth: 9, markerHeight: 7, refX: 8, refY: 3.5, orient: 'auto' });
      m.appendChild(el('path', { d: 'M0,0 L9,3.5 L0,7 z', fill: color }));
      return m;
    };
    defs.appendChild(mkMarker('vr3-arrow-l3', l3Color));
    defs.appendChild(mkMarker('vr3-arrow-l2', l2Color));
    defs.appendChild(mkMarker('vr3-arrow-l1', l1Color));
    defs.appendChild(mkMarker('vr3-arrow-g', nvGreen));
    defs.appendChild(mkMarker('vr3-arrow-n', '#94a3b8'));
    const shine = el('radialGradient', { id: 'vr3-shine', cx: '35%', cy: '30%', r: '65%' });
    shine.appendChild(el('stop', { offset: '0%', 'stop-color': '#ffffff', 'stop-opacity': 0.85 }));
    shine.appendChild(el('stop', { offset: '100%', 'stop-color': '#ffffff', 'stop-opacity': 0 }));
    defs.appendChild(shine);
    // v8.4: 芯片造型渐变（IHS 金属 / 计算DIE / HBM）
    const lg = (id, c1, c2, c3) => {
      const g = el('linearGradient', { id, x1: 0, y1: 0, x2: 1, y2: 1 });
      g.appendChild(el('stop', { offset: '0%', 'stop-color': c1 }));
      g.appendChild(el('stop', { offset: '50%', 'stop-color': c2 }));
      g.appendChild(el('stop', { offset: '100%', 'stop-color': c3 }));
      defs.appendChild(g);
    };
    lg('vr3-ihs', '#f8fafc', '#d7dee8', '#8d9aab');
    lg('vr3-die', '#3b4b66', '#243149', '#141d30');
    lg('vr3-hbm', '#2f6f92', '#1d4f6b', '#12384f');
    svg.appendChild(defs);

    const mainG = el('g', { id: 'vr-transform-group' });
    svg.appendChild(mainG);

    // ---- 等轴测投影：sx = ox+(x-y)·cos30, sy = oy+(x+y)/2 - z ----
    const C30 = Math.cos(Math.PI / 6);
    const iso = (x, y, z, o) => [o.ox + (x - y) * C30, o.oy + (x + y) * 0.5 - z];

    // ---- 形状库：立方体 / 圆柱 / 四棱锥 / 三棱柱 / 球体 ----
    const grp = (id, color) => {
      // v8.3: 仅带 id 的组才作为可高亮模块；嵌套内部组不参与高亮，避免被误 dim
      const g = el('g', id ? { class: 'vr-module', 'data-vr-id': id } : {});
      g.style.color = color;
      return g;
    };
    const poly = (pts, color, fo, sw) => el('polygon', {
      class: 'vr-mod-rect', points: pts.map(p => p.map(v => Math.round(v * 10) / 10).join(',')).join(' '),
      fill: color, 'fill-opacity': fo, stroke: color, 'stroke-width': sw || 1, 'stroke-opacity': 0.75, 'stroke-linejoin': 'round'
    });

    // 立方体（计算托盘 / GPU / CPU / DPU / 背板 / 平台）
    const isoBox = (o, x, y, z, w, d, h, color, opts) => {
      opts = opts || {};
      const P = (px, py, pz) => iso(px, py, pz, o);
      const A = P(x, y, z + h), B = P(x + w, y, z + h), C = P(x + w, y + d, z + h), D = P(x, y + d, z + h);
      const E = P(x, y + d, z), F = P(x + w, y + d, z), G = P(x + w, y, z);
      const g = grp(opts.id, color);
      g.appendChild(poly([B, C, F, G], color, opts.sideOp != null ? opts.sideOp : 0.08, opts.sw));
      g.appendChild(poly([D, C, F, E], color, opts.frontOp != null ? opts.frontOp : 0.16, opts.sw));
      g.appendChild(poly([A, B, C, D], color, opts.topOp != null ? opts.topOp : 0.30, opts.sw));
      return g;
    };

    // 圆柱（二级可信根 / 电源 / 液冷CDU / 冷却管口）
    const isoCyl = (o, cx, cy, z, r, h, color, opts) => {
      opts = opts || {};
      const a = r * 1.2247, b = r * 0.7071;
      const tx = iso(cx, cy, z + h, o), by = iso(cx, cy, z, o);
      const g = grp(opts.id, color);
      g.appendChild(el('path', {
        class: 'vr-mod-rect',
        d: 'M ' + (by[0] - a) + ' ' + by[1] + ' L ' + (by[0] - a) + ' ' + tx[1] +
           ' A ' + a + ' ' + b + ' 0 0 1 ' + (by[0] + a) + ' ' + tx[1] +
           ' L ' + (by[0] + a) + ' ' + by[1] + ' A ' + a + ' ' + b + ' 0 0 0 ' + (by[0] - a) + ' ' + by[1] + ' Z',
        fill: color, 'fill-opacity': opts.sideOp != null ? opts.sideOp : 0.16, stroke: color, 'stroke-width': opts.sw || 1, 'stroke-opacity': 0.7
      }));
      g.appendChild(el('ellipse', { class: 'vr-mod-rect', cx: tx[0], cy: tx[1], rx: a, ry: b, fill: color, 'fill-opacity': opts.topOp != null ? opts.topOp : 0.34, stroke: color, 'stroke-width': opts.sw || 1, 'stroke-opacity': 0.85 }));
      return g;
    };

    // 四棱锥（三级可信根 · 集群信任锚）
    const isoPyr = (o, cx, cy, z, hw, hd, h, color, opts) => {
      opts = opts || {};
      const A = iso(cx - hw, cy - hd, z, o), B = iso(cx + hw, cy - hd, z, o);
      const C = iso(cx + hw, cy + hd, z, o), D = iso(cx - hw, cy + hd, z, o), T = iso(cx, cy, z + h, o);
      const g = grp(opts.id, color);
      g.appendChild(poly([T, A, B], color, 0.05, opts.sw));
      g.appendChild(poly([T, D, A], color, 0.07, opts.sw));
      g.appendChild(poly([T, B, C], color, 0.15, opts.sw));
      g.appendChild(poly([T, C, D], color, 0.30, opts.sw));
      return g;
    };

    // 三棱柱（NVLink 6 交换托盘 / ConnectX-9 SuperNIC）
    const isoPrism = (o, x, y, z, w, d, h, color, opts) => {
      opts = opts || {};
      const P = (px, py, pz) => iso(x + px, y + py, pz, o);
      const T1 = P(0, 0, h), T2 = P(w, 0, h), T3 = P(w * 0.5, d, h);
      const B1 = P(0, 0, 0), B2 = P(w, 0, 0), B3 = P(w * 0.5, d, 0);
      const g = grp(opts.id, color);
      g.appendChild(poly([T1, T2, B2, B1], color, 0.06, opts.sw));
      g.appendChild(poly([T1, T3, B3, B1], color, 0.10, opts.sw));
      g.appendChild(poly([T2, T3, B3, B2], color, 0.17, opts.sw));
      g.appendChild(poly([T1, T2, T3], color, 0.32, opts.sw));
      return g;
    };

    // 球体（一级可信根 Caliptra · 芯片内信任锚，带高光）
    const isoBall = (o, cx, cy, z, r, color, opts) => {
      opts = opts || {};
      const c = iso(cx, cy, z, o);
      const g = grp(opts.id, color);
      g.appendChild(el('circle', { class: 'vr-mod-rect', cx: c[0], cy: c[1], r: r, fill: color, 'fill-opacity': 0.45, stroke: color, 'stroke-width': 1.1 }));
      g.appendChild(el('circle', { cx: c[0], cy: c[1], r: r, fill: 'url(#vr3-shine)', 'pointer-events': 'none' }));
      return g;
    };

    // v8.1: 形象化部件生成器 — 薄基板 + DIE 阵列 + 把手/鳍片/端口/LED/风扇/蛇形流道/插槽齿/管口/桥接
    const isoPart = (o, x, y, z, w, d, color, opts) => {
      opts = opts || {};
      const t = opts.t != null ? opts.t : 5;
      const g = grp(opts.id, color);
      // 基板（薄板）
      g.appendChild(isoBox(o, x, y, z, w, d, t, color,
        { topOp: opts.topOp != null ? opts.topOp : 0.26, frontOp: 0.14, sideOp: 0.08, sw: 0.9 }));
      // DIE 阵列（芯片封装：[dx,dy,dw,dd,dh,(c)]）
      (opts.dies || []).forEach(dd => {
        g.appendChild(isoBox(o, x + dd[0], y + dd[1], z + t, dd[2], dd[3], dd[4], dd[5] || color,
          { topOp: 0.52, frontOp: 0.3, sideOp: 0.18, sw: 0.7 }));
      });
      // 双 DIE 桥接（NVLink-C2C · Superchip）：[x1,y1,x2,y2,h]
      if (opts.bridge) {
        const b = opts.bridge;
        const p1 = iso(x + b[0], y + b[1], z + t + b[4], o), p2 = iso(x + b[2], y + b[3], z + t + b[4], o);
        g.appendChild(el('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], stroke: color, 'stroke-width': 3, 'stroke-linecap': 'round', opacity: 0.85 }));
      }
      // 前脸装饰：把手（抽屉）/ 端口（网卡）/ LED（1U 服务器）/ 风扇（电源）
      const fz = z + t * 0.5;
      const fr = (fx, fw, fh, fo) => {
        const a = iso(x + fx, y + d, fz, o), b2 = iso(x + fx + fw, y + d, fz, o);
        const c2 = iso(x + fx + fw, y + d, fz + fh, o), d2 = iso(x + fx, y + d, fz + fh, o);
        g.appendChild(poly([a, b2, c2, d2], color, fo, 0.7));
      };
      if (opts.handle) fr(w / 2 - 26, 52, 4, 0.55);
      if (opts.ports) for (let i = 0; i < opts.ports; i++) fr(10 + i * 16, 11, 8, 0.5);
      if (opts.led) for (let i = 0; i < opts.led; i++) {
        const c2 = iso(x + 9 + i * 11, y + d, fz, o);
        g.appendChild(el('ellipse', { cx: c2[0], cy: c2[1], rx: 3.2, ry: 1.9, fill: '#4ade80', 'fill-opacity': 0.9 }));
      }
      if (opts.fan) {
        const c2 = iso(x + w / 2, y + d, fz + 10, o);
        g.appendChild(el('ellipse', { cx: c2[0], cy: c2[1], rx: 15, ry: 8.5, fill: 'none', stroke: color, 'stroke-width': 1.4, opacity: 0.9 }));
        g.appendChild(el('ellipse', { cx: c2[0], cy: c2[1], rx: 4.5, ry: 2.6, fill: color, 'fill-opacity': 0.45 }));
      }
      // 顶部鳍片（散热托盘）
      if (opts.fins) for (let i = 0; i < opts.fins; i++) {
        const fw = 10, gap = (w - 20 - opts.fins * fw) / Math.max(1, opts.fins - 1);
        g.appendChild(isoBox(o, x + 10 + i * (fw + gap), y + 14, z + t, fw, d - 28, 9, color,
          { topOp: 0.42, frontOp: 0.22, sideOp: 0.12, sw: 0.6 }));
      }
      // 顶面蛇形流道（液冷冷板）
      if (opts.snake) {
        const zz = z + t + 1.2, step = (d - 32) / 2;
        let dd2 = 'M ' + iso(x + 18, y + 16, zz, o).map(v => Math.round(v)).join(' ');
        for (let r = 0; r < 3; r++) {
          const yy = y + 16 + r * step;
          dd2 += ' L ' + iso(x + w - 18, yy, zz, o).map(v => Math.round(v)).join(' ');
          dd2 += ' L ' + iso(x + w - 18, yy + step, zz, o).map(v => Math.round(v)).join(' ');
          dd2 += ' L ' + iso(x + 18, yy + step, zz, o).map(v => Math.round(v)).join(' ');
        }
        dd2 += ' L ' + iso(x + w - 18, y + d - 16, zz, o).map(v => Math.round(v)).join(' ');
        g.appendChild(el('path', { d: dd2, fill: 'none', stroke: '#7dd3fc', 'stroke-width': 4.5, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', opacity: 0.85 }));
      }
      // 顶部管口（冷板/CDU 进出水）
      if (opts.pipes) for (let i = 0; i < opts.pipes; i++) {
        const px = opts.pipes === 1 ? x + w / 2 : x + 26 + i * (w - 52) / (opts.pipes - 1);
        g.appendChild(isoCyl(o, px, y + 24, z + t, 8, 8, '#7dd3fc'));
      }
      // 底缘插槽齿（背板）
      if (opts.slots) for (let i = 0; i < opts.slots; i++) {
        g.appendChild(isoBox(o, x + 14 + i * ((w - 28) / (opts.slots - 1)), y + d / 2 - 7, z - 9, 8, 14, 9, color,
          { topOp: 0.35, frontOp: 0.2, sideOp: 0.1, sw: 0.6 }));
      }
      return g;
    };

    // ============ v8.4: 芯片造型库（源自 CGPU.html 方案 B + 可信根视图）============
    // 等轴测三面顶点
    const boxT = (o, x, y, z, w, d) => [iso(x, y, z, o), iso(x + w, y, z, o), iso(x + w, y + d, z, o), iso(x, y + d, z, o)];
    const boxF = (o, x, y, z, w, d, h) => [iso(x, y + d, z, o), iso(x + w, y + d, z, o), iso(x + w, y + d, z + h, o), iso(x, y + d, z + h, o)];
    const boxS = (o, x, y, z, w, d, h) => [iso(x + w, y, z, o), iso(x + w, y + d, z, o), iso(x + w, y + d, z + h, o), iso(x + w, y, z + h, o)];
    // 单面多边形（fill 支持渐变 url）
    const chipPoly = (pts, fill, fo, stroke, sw, so) => el('polygon', {
      class: 'vr-mod-rect', points: pts.map(p => p.map(v => Math.round(v * 10) / 10).join(',')).join(' '),
      fill: fill, 'fill-opacity': fo, stroke: stroke, 'stroke-width': sw || 1, 'stroke-opacity': so != null ? so : 0.75, 'stroke-linejoin': 'round'
    });
    // 顶面等轴测刻印文字
    const topText = (g, o, x, y, z, str, size, fill) => {
      const t = iso(x, y, z, o);
      const m = `matrix(${(C30 * size).toFixed(4)},${(0.5 * size).toFixed(4)},${(-C30 * size).toFixed(4)},${(0.5 * size).toFixed(4)},${t[0].toFixed(1)},${t[1].toFixed(1)})`;
      const tx = el('text', { transform: m, 'font-size': 1, fill: fill, 'text-anchor': 'middle', 'font-weight': 700 });
      tx.textContent = str;
      g.appendChild(tx);
    };
    // Caliptra 加粗刻印（光晕 + 主虚线，青绿色；带 id 可独立高亮）
    const calEtch = (o, x, y, z, s, id) => {
      const wrap = id ? grp(id, l1Color) : el('g', {});
      const pts = boxT(o, x, y, z, s, s).map(p => p.map(v => Math.round(v * 10) / 10).join(',')).join(' ');
      wrap.appendChild(el('polygon', { points: pts, fill: 'none', stroke: l1Color, 'stroke-width': 4, 'stroke-dasharray': '4 2.5', opacity: 0.28 }));
      wrap.appendChild(el('polygon', { points: pts, fill: l1Color, 'fill-opacity': 0.3, stroke: l1Color, 'stroke-width': 1.8, 'stroke-dasharray': '3.5 2' }));
      return wrap;
    };
    // 安全引擎刻印（二级紫色，虚线）
    const l2Etch = (g, o, x, y, z, s) => {
      const pts = boxT(o, x, y, z, s, s);
      g.appendChild(el('polygon', { points: pts.map(p => p.map(v => Math.round(v * 10) / 10).join(',')).join(' '), fill: '#c084fc', 'fill-opacity': 0.22, stroke: '#c084fc', 'stroke-width': 1.3, 'stroke-dasharray': '3 2' }));
    };
    // GPU 芯片（方案 B）：绿基板 + HBM×4 + 中央DIE + 薄金属盖 + Caliptra 刻印（54×54，高17）
    const gpuChipB = (o, x, y, z, id) => {
      const g = grp(id, nvGreen);
      g.appendChild(chipPoly(boxS(o, x, y, z, 54, 54, 6), '#15803d', 0.12));
      g.appendChild(chipPoly(boxF(o, x, y, z, 54, 54, 6), '#15803d', 0.22));
      g.appendChild(chipPoly(boxT(o, x, y, z + 6, 54, 54), '#15803d', 0.45));
      [[0, 6], [0, 29], [45, 6], [45, 29]].forEach(p => {
        const hx = x + p[0], hy = y + p[1];
        g.appendChild(chipPoly(boxS(o, hx, hy, z + 6, 9, 19, 7), '#155e75', 0.3));
        g.appendChild(chipPoly(boxF(o, hx, hy, z + 6, 9, 19, 7), '#155e75', 0.5));
        g.appendChild(chipPoly(boxT(o, hx, hy, z + 13, 9, 19), 'url(#vr3-hbm)', 0.9, '#67e8f9', 0.5));
      });
      const dx = x + 13, dy = y + 9;
      g.appendChild(chipPoly(boxS(o, dx, dy, z + 6, 28, 36, 8), '#0f172a', 0.35));
      g.appendChild(chipPoly(boxF(o, dx, dy, z + 6, 28, 36, 8), '#0f172a', 0.55));
      g.appendChild(chipPoly(boxT(o, dx, dy, z + 14, 28, 36), 'url(#vr3-die)', 0.95, '#334155', 0.6));
      g.appendChild(chipPoly(boxS(o, x + 2.5, y + 2.5, z + 14, 49, 49, 3), '#cbd5e1', 0.09));
      g.appendChild(chipPoly(boxF(o, x + 2.5, y + 2.5, z + 14, 49, 49, 3), '#cbd5e1', 0.13));
      g.appendChild(chipPoly(boxT(o, x + 2.5, y + 2.5, z + 17, 49, 49), 'url(#vr3-ihs)', 0.32, '#cbd5e1', 0.7));
      g.appendChild(calEtch(o, x + 16, y + 12, z + 17.2, 8, 'vr-lv1-gpu'));
      return g;
    };
    // CPU 芯片（方案 B）：绿基板 + 黑封装 + 银色IHS + Caliptra 刻印（108×50，高22）
    const cpuChipB = (o, x, y, z, id) => {
      const g = grp(id, nvGreen);
      g.appendChild(chipPoly(boxS(o, x, y, z, 108, 50, 6), '#15803d', 0.12));
      g.appendChild(chipPoly(boxF(o, x, y, z, 108, 50, 6), '#15803d', 0.22));
      g.appendChild(chipPoly(boxT(o, x, y, z + 6, 108, 50), '#15803d', 0.45));
      g.appendChild(chipPoly(boxS(o, x + 8, y + 6, z + 6, 92, 38, 8), '#111827', 0.35, '#374151', 0.7));
      g.appendChild(chipPoly(boxF(o, x + 8, y + 6, z + 6, 92, 38, 8), '#111827', 0.5, '#374151', 0.7));
      g.appendChild(chipPoly(boxT(o, x + 8, y + 6, z + 14, 92, 38), '#111827', 0.85, '#374151', 0.7));
      g.appendChild(chipPoly(boxS(o, x + 14, y + 10, z + 14, 80, 30, 8), '#94a3b8', 0.4, '#cbd5e1', 0.8));
      g.appendChild(chipPoly(boxF(o, x + 14, y + 10, z + 14, 80, 30, 8), '#94a3b8', 0.55, '#cbd5e1', 0.8));
      g.appendChild(chipPoly(boxT(o, x + 14, y + 10, z + 22, 80, 30), 'url(#vr3-ihs)', 0.95, '#cbd5e1', 0.9));
      g.appendChild(calEtch(o, x + 72, y + 22, z + 22.2, 7, 'vr-lv1-cpu'));
      return g;
    };
    // 二级可信根芯片：绿基板 + 黑封装 + Zynq 刻印 + 紫色安全引擎刻印（118×78，高16）
    const l2Chip = (o, x, y, z, id) => {
      const g = grp(id, l2Color);
      g.appendChild(chipPoly(boxS(o, x, y, z, 118, 78, 6), '#15803d', 0.12));
      g.appendChild(chipPoly(boxF(o, x, y, z, 118, 78, 6), '#15803d', 0.22));
      g.appendChild(chipPoly(boxT(o, x, y, z + 6, 118, 78), '#15803d', 0.45));
      g.appendChild(chipPoly(boxS(o, x + 10, y + 8, z + 6, 98, 62, 10), '#111827', 0.35, '#374151', 0.7));
      g.appendChild(chipPoly(boxF(o, x + 10, y + 8, z + 6, 98, 62, 10), '#111827', 0.5, '#374151', 0.7));
      g.appendChild(chipPoly(boxT(o, x + 10, y + 8, z + 16, 98, 62), '#111827', 0.85, '#374151', 0.7));
      topText(g, o, x + 50, y + 36, z + 16.2, 'Zynq MPSoC', 4.5, '#9ca3af');
      l2Etch(g, o, x + 84, y + 50, z + 16.2, 13);
      return g;
    };
    // 三级可信根芯片：绿基板 + 黑封装 + OpenTitan 刻印（72×72，高18）
    const l3Chip = (o, x, y, z, id) => {
      const g = grp(id, l3Color);
      g.appendChild(chipPoly(boxS(o, x, y, z, 72, 72, 6), '#15803d', 0.12));
      g.appendChild(chipPoly(boxF(o, x, y, z, 72, 72, 6), '#15803d', 0.22));
      g.appendChild(chipPoly(boxT(o, x, y, z + 6, 72, 72), '#15803d', 0.45));
      g.appendChild(chipPoly(boxS(o, x + 7, y + 7, z + 6, 58, 58, 12), '#111827', 0.35, '#374151', 0.7));
      g.appendChild(chipPoly(boxF(o, x + 7, y + 7, z + 6, 58, 58, 12), '#111827', 0.5, '#374151', 0.7));
      g.appendChild(chipPoly(boxT(o, x + 7, y + 7, z + 18, 58, 58), '#111827', 0.85, '#374151', 0.7));
      topText(g, o, x + 36, y + 36, z + 18.2, 'OpenTitan', 4.5, '#9ca3af');
      return g;
    };

    const txt = (x, y, str, color, fs, anchor, weight) => {
      const t = el('text', { x, y, 'font-size': fs || 10, fill: color, 'text-anchor': anchor || 'start', 'font-weight': weight || 400 });
      t.textContent = str;
      mainG.appendChild(t);
      return t;
    };

    // ---- 动态信号流：流动虚线 + 沿路径运动的光点（区别于静态模块）----
    const MARKER = {};
    MARKER[l3Color] = 'url(#vr3-arrow-l3)';
    MARKER[l2Color] = 'url(#vr3-arrow-l2)';
    MARKER[l1Color] = 'url(#vr3-arrow-l1)';
    MARKER[nvGreen] = 'url(#vr3-arrow-g)';
    MARKER['#94a3b8'] = 'url(#vr3-arrow-n)';
    const flow = (d, color, edgeId, w, dur) => {
      const p = el('path', {
        class: 'vr-edge vr3-flow', d: d, stroke: color, 'stroke-width': w || 2,
        'marker-end': MARKER[color] || 'url(#vr3-arrow-n)'
      });
      if (edgeId) p.setAttribute('data-vr-edge', edgeId);
      p.style.color = color;
      mainG.appendChild(p);
      const dot = el('circle', { class: 'vr3-flow-particle', r: 3, fill: color });
      dot.style.color = color;
      dot.appendChild(el('animateMotion', { dur: dur || '2s', repeatCount: 'indefinite', path: d }));
      mainG.appendChild(dot);
    };
    // 3D 折线（走层间隙，不覆盖模块）→ path d
    const seg = (o, pts) => pts.map((p, i) => (i === 0 ? 'M ' : ' L ') + iso(p[0], p[1], p[2], o).map(v => Math.round(v * 10) / 10).join(' ')).join('');

    // ---- 引出线标注：部件名称不放在部件上，引线到右侧标签 ----
    const leader = (pt, color, main, sub, dy) => {
      const y = pt[1] + (dy || 0);
      const ax = 1116;
      mainG.appendChild(el('circle', { cx: pt[0], cy: pt[1], r: 2.6, fill: color }));
      mainG.appendChild(el('polyline', {
        class: 'vr3-leader',
        points: Math.round(pt[0]) + ',' + Math.round(pt[1]) + ' ' + (Math.round(pt[0]) + 10) + ',' + Math.round(y) + ' ' + ax + ',' + Math.round(y),
        stroke: color, 'stroke-width': 1
      }));
      const t1 = el('text', { x: ax + 6, y: y, 'font-size': 10.5, 'font-weight': 700, fill: color });
      t1.textContent = main;
      mainG.appendChild(t1);
      if (sub) {
        const t2 = el('text', { x: ax + 6, y: y + 13, 'font-size': 8.5, fill: '#94a3b8' });
        t2.textContent = sub;
        mainG.appendChild(t2);
      }
    };

    // ========================================
    // 左侧：NVL72 机柜（顶部/底部各一组托盘，中间省略）
    // ========================================
    const o1 = { ox: 480, oy: 830 };
    // 玻璃框架 + 底座
    mainG.appendChild(isoBox(o1, -8, -8, 10, 266, 128, 545, nvGreen, { topOp: 0.04, frontOp: 0.025, sideOp: 0.015, sw: 1.5 }));
    mainG.appendChild(isoBox(o1, 0, 0, 2, 250, 110, 8, '#334155', { topOp: 0.2, frontOp: 0.1, sideOp: 0.06 }));
    // 底部：电源（风扇方盒）+ 液冷CDU（水冷塔 + 进出水管口）
    mainG.appendChild(isoPart(o1, 30, 23, 14, 64, 64, extColor, { id: 'vr-power', t: 44, fan: 1 }));
    mainG.appendChild(isoPart(o1, 156, 23, 14, 64, 64, '#38bdf8', { id: 'vr-cdu', t: 50, pipes: 2 }));
    // v8.2: 托盘阵列 — 计算托盘(绿·方块) / 交换托盘(青·平板)，中部省略号
    const TRAY_SEQ = [
      [116, 'c', 'vr-tray-1'], [142, 's', 'vr-sw-1'], [168, 'c', 'vr-tray-2'],
      [194, 'c', 'vr-tray-3'], [220, 's', 'vr-sw-2'], [246, 'c', 'vr-tray-4'],
      [346, 'c', 'vr-tray-5'], [372, 'c', 'vr-tray-6'], [398, 's', 'vr-sw-3'],
      [424, 'c', 'vr-tray-7'], [450, 'c', 'vr-tray-8'], [476, 's', 'vr-sw-9'],
      [502, 'c', 'vr-tray-17'], [528, 'c', 'vr-tray-18'],
    ];
    TRAY_SEQ.forEach(t => {
      mainG.appendChild(isoBox(o1, 8, 9, t[0], 234, 92, 10, t[1] === 'c' ? nvGreen : swColor,
        { id: t[2], topOp: 0.3, frontOp: 0.16, sideOp: 0.09 }));
    });
    // 中部省略号（13 层托盘）
    txt(540, 600, '⋮', '#94a3b8', 22, 'middle', 700);
    txt(540, 628, '中间省略 13 层托盘', '#64748b', 9.5, 'middle');
    // 机柜顶：集群层平台 + 三级可信根（方块）+ RAS / 管理平面（1U 服务器）
    mainG.appendChild(isoBox(o1, -14, -14, 556, 296, 142, 12, l3Color, { topOp: 0.08, frontOp: 0.04, sideOp: 0.025, sw: 1.2 }));
    // v8.4: 三级可信根 — SoC 芯片造型（绿基板 + 黑封装 + OpenTitan 刻印）
    mainG.appendChild(l3Chip(o1, 24, 19, 568, 'vr-lv3'));
    mainG.appendChild(isoPart(o1, 128, 12, 568, 62, 42, nvPurple, { id: 'vr-ras', t: 10, led: 3 }));
    mainG.appendChild(isoPart(o1, 200, 12, 568, 46, 42, '#60a5fa', { id: 'vr-mgmt', t: 10, led: 2 }));
    // UART 度量授权：三级可信根芯片 → 顶部托盘（二级可信根所在平台），动态流
    flow(seg(o1, [[96, 55, 577], [96, 55, 549], [125, 55, 549], [125, 55, 541]]), l3Color, 'vr-e-lv3-mgmt', 2, '1.6s');
    txt(545, 342, 'UART 度量授权 · 三级→二级', l3Color, 9);

    // ========================================
    // 右侧：拉出展开的 1 个计算托盘（爆炸图 · 层间距大 · 引出线标注）
    // ========================================
    const o2 = { ox: 850, oy: 600 };
    // 层间爆炸导引虚线（左右各一，简洁）
    const gaps = [[16, 60], [76, 108], [142, 192], [238, 264], [296, 326]];
    gaps.forEach(g => {
      [[8, 75], [292, 75]].forEach(pt => {
        const a = iso(pt[0], pt[1], g[0], o2), b = iso(pt[0], pt[1], g[1], o2);
        mainG.appendChild(el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke: '#475569', 'stroke-width': 0.8, 'stroke-dasharray': '3 4', opacity: 0.55 }));
      });
    });
    // 散热层：液冷冷板（平板 + 进出水管口）
    mainG.appendChild(isoBox(o2, 0, 0, 0, 300, 150, 12, '#38bdf8', { id: 'vr-coldplate', topOp: 0.2, frontOp: 0.11, sideOp: 0.06 }));
    mainG.appendChild(isoCyl(o2, 40, 26, 12, 9, 9, '#7dd3fc'));
    mainG.appendChild(isoCyl(o2, 260, 26, 12, 9, 9, '#7dd3fc'));
    // 主板
    mainG.appendChild(isoBox(o2, 0, 0, 64, 300, 150, 10, '#64748b', { id: 'vr-board', topOp: 0.15, frontOp: 0.08, sideOp: 0.05 }));
    // v8.4: 芯片层 — 方案 B 芯片造型（GPU：HBM 多DIE + 薄金属盖；CPU：银色 IHS 顶盖；Caliptra 顶面刻印）
    for (let i = 0; i < 4; i++) {
      mainG.appendChild(gpuChipB(o2, 18 + i * 68, 8, 112, 'vr-rubin-gpu'));
    }
    [24, 168].forEach(cx => {
      mainG.appendChild(cpuChipB(o2, cx, 84, 112, 'vr-vera-cpu'));
    });
    // 平台安全层：二级可信根 — SoC 芯片造型（绿基板 + 黑封装 + Zynq 刻印 + 紫色安全引擎刻印）
    mainG.appendChild(l2Chip(o2, 16, 36, 196, 'vr-lv2'));
    // IO/网络层：BlueField-4 DPU + ConnectX-9 SuperNIC（扁方块），位于二级可信根上方
    mainG.appendChild(isoBox(o2, 16, 36, 268, 118, 78, 20, '#ec4899', { id: 'vr-bluefield', topOp: 0.28, frontOp: 0.15 }));
    mainG.appendChild(isoBox(o2, 166, 36, 268, 118, 78, 20, '#06b6d4', { id: 'vr-connectx', topOp: 0.28, frontOp: 0.15 }));
    // 背板层（薄板，最顶）
    mainG.appendChild(isoBox(o2, 0, 0, 330, 300, 150, 10, nvGreen, { id: 'vr-tray-backplane', topOp: 0.14, frontOp: 0.07, sideOp: 0.04 }));

    // ---- v8.4 信号流（全部走层间隙折线，不覆盖模块）----
    // 二级 → BlueField-4 DPU（策略下发 · 熵源，垂直直连）
    flow(seg(o2, [[75, 75, 212], [75, 75, 268]]), l2Color, 'vr-e-lv2-bf', 2, '1.8s');
    // 二级 → ConnectX-9（层间隙折线绕行）
    flow(seg(o2, [[134, 75, 205], [225, 75, 205], [225, 75, 268]]), l2Color, 'vr-e-lv2-cx', 1.6, '2s');
    // Caliptra（CPU IHS 顶刻印）→ 二级（PCR 上报）
    flow(seg(o2, [[99, 109, 136], [99, 109, 212]]), l1Color, 'vr-e-lv1cpu', 1.5, '1.7s');
    // Caliptra（GPU 薄盖顶刻印）→ 二级（层间隙折线）
    flow(seg(o2, [[174, 26, 132], [174, 26, 175], [110, 42, 175], [110, 42, 212]]), l1Color, 'vr-e-lv1gpu', 1.5, '1.9s');
    // BlueField-4 ↔ ConnectX-9（策略联动）
    flow(seg(o2, [[134, 75, 279], [166, 75, 279]]), '#94a3b8', 'vr-e-bf-connectx', 2, '1.4s');
    // 信号标签（放间隙空白处，避开部件与引出线）
    txt(868, 428, '策略下发 · 熵源', l2Color, 8.5);
    txt(788, 548, 'PCR 上报 ×6', l1Color, 8.5);
    txt(960, 368, '策略联动', '#94a3b8', 8);

    // 机柜 → 展开托盘 关联流
    const linkA = iso(242, 55, 481, o1), linkB = iso(150, 0, 335, o2);
    flow('M ' + Math.round(linkA[0]) + ' ' + Math.round(linkA[1]) + ' Q 780 330 ' + Math.round(linkB[0]) + ' ' + Math.round(linkB[1]), nvGreen, null, 1.6, '2.4s');
    txt(770, 352, '拉出展开 1 / 18 计算托盘', nvGreen, 9.5, 'middle');

    // ---- 右侧引出线标注（自上而下：背板 → IO → 二级 → 一级 → 芯片 → 主板 → 冷板，标签互不重叠）----
    leader(iso(300, 75, 336, o2), nvGreen, '托盘背板', 'NVLink 6 · 800G IO 接入', -16);
    leader(iso(225, 114, 284, o2), '#06b6d4', 'ConnectX-9 SuperNIC', '800 Gb/s RDMA · 东西向硬件隔离');
    leader(iso(120, 72, 210, o2), l2Color, '二级可信根 · Zynq MPSoC', 'SoC 芯片 · 每 DPU 对应一个 · vTPM/TRNG/PDP', 22);
    leader(iso(243, 24, 132, o2), l1Color, '一级可信根 · Caliptra', 'GPU/CPU 顶面刻印 · 片内集成协处理器 ×6');
    leader(iso(249, 35, 130, o2), nvGreen, '4×Rubin GPU + 2×Vera CPU', '金属顶盖 / HBM4 多DIE 封装', 8);
    leader(iso(300, 75, 74, o2), '#64748b', '计算托盘主板', 'Cableless 无缆化设计');
    leader(iso(300, 75, 8, o2), '#38bdf8', '液冷冷板', '平板 + 进出水管口 · 100% 液冷');

    // ---- 左侧层次标注卡（集群 → 机架 → 托盘 → 芯片）----
    const layers = [
      { y: 50, c: l3Color, t: '集群层 · POD 级', s1: '三级可信根 OpenTitan（SoC 芯片）', s2: 'ML-DSA 远程证明 · PKI 根 CA', tgt: iso(60, 55, 586, o1) },
      { y: 142, c: nvGreen, t: '机架层 · NVL72 机柜', s1: '18 计算托盘 + 9 交换托盘（平板）', s2: '机架级 TEE · 260 TB/s NVLink 域', tgt: iso(125, 9, 530, o1) },
      { y: 234, c: l2Color, t: '托盘层 · 平台级', s1: 'BlueField-4 之下（每 DPU 对应一个）', s2: '二级可信根 Zynq MPSoC（SoC 芯片）', tgt: iso(75, 75, 210, o2) },
      { y: 326, c: l1Color, t: '芯片层 · Superchip ×2', s1: '2×Vera CPU + 4×Rubin GPU', s2: '一级可信根 Caliptra（片内刻印）', tgt: iso(243, 24, 132, o2) },
    ];
    layers.forEach(L => {
      mainG.appendChild(el('rect', { x: 30, y: L.y, width: 305, height: 66, rx: 8, fill: L.c, 'fill-opacity': 0.07, stroke: L.c, 'stroke-opacity': 0.5, 'stroke-width': 1 }));
      txt(44, L.y + 24, L.t, L.c, 11.5, 'start', 700);
      txt(44, L.y + 42, L.s1, '#94a3b8', 9);
      txt(44, L.y + 55, L.s2, '#94a3b8', 9);
      mainG.appendChild(el('line', { x1: 335, y1: L.y + 33, x2: Math.round(L.tgt[0]), y2: Math.round(L.tgt[1]), stroke: L.c, 'stroke-width': 1, 'stroke-dasharray': '3 3', opacity: 0.5 }));
    });

    // 底部注释
    txt(540, 1000, 'NVL72 机柜（示意）：18 计算托盘（绿）+ 9 交换托盘（青）· 显示 14 层，中部省略 13 层', '#94a3b8', 10, 'middle');
    txt(540, 1018, '底部：电源（风扇方盒）+ 液冷 CDU（水冷塔）· 整柜 100% 液冷 · 72 GPU + 36 CPU', '#64748b', 9, 'middle');
  }

  // ============ 渲染 Vera Rubin 图例 ============
  function renderVeraLegend(mode) {
    const legend = $('#vr-legend');
    if (!legend) return;
    const flatItems = [
      { c: '#76b900', t: 'Vera Rubin 原生组件' },
      { c: LEVEL_COLORS[3].primary, t: '三级可信根 (集群级)' },
      { c: LEVEL_COLORS[2].primary, t: '二级可信根 (平台级)' },
      { c: LEVEL_COLORS[1].primary, t: '一级可信根 (芯片级)' },
      { c: '#8b5cf6', t: '远程证明/管理' },
      { c: '#f59e0b', t: '外部网络' },
    ];
    const threeDItems = [
      { c: LEVEL_COLORS[3].primary, t: '三级可信根 · SoC 芯片（集群锚）' },
      { c: '#76b900', t: '计算托盘 · 方块 / 计算芯片 · 金属顶盖封装' },
      { c: '#22d3ee', t: '交换托盘 · 平板' },
      { c: LEVEL_COLORS[2].primary, t: '二级可信根 · SoC 芯片（每 DPU 一个）' },
      { c: LEVEL_COLORS[1].primary, t: '一级可信根 Caliptra · 芯片顶面刻印' },
      { c: '#38bdf8', t: '液冷冷板 · 平板+管口' },
      { c: '#ec4899', t: 'DPU / SuperNIC · 扁方块' },
      { c: '#f59e0b', t: '电源 · 风扇方盒 / CDU · 水冷塔' },

    const items = (mode === '3d') ? threeDItems : flatItems;

  // ============ v7: SVG 滚轮缩放 + 拖动平移 ============
  const vrView = { x: 0, y: 0, scale: 1 };

  function applyVrTransform() {
    const g = $('#vr-transform-group');
    if (g) g.setAttribute('transform', `translate(${vrView.x},${vrView.y}) scale(${vrView.scale})`);
    const ind = $('#vr-zoom-indicator');
    if (ind) ind.textContent = `缩放: ${Math.round(vrView.scale * 100)}%`;
  }

  function resetVrView() {
    vrView.x = 0; vrView.y = 0; vrView.scale = 1;
    applyVrTransform();
  }

  function zoomVrBy(factor) {
    vrView.scale = Math.max(0.3, Math.min(5, vrView.scale * factor));
    applyVrTransform();
  }

  function bindVeraZoomPan() {
    const svgEl = $('#vr-svg');
    if (!svgEl) return;

    // 重置变换状态
    vrView.x = 0; vrView.y = 0; vrView.scale = 1;
    applyVrTransform();

    // 滚轮缩放（以鼠标位置为中心）
    svgEl.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.88 : 1.14;
      const newScale = Math.max(0.3, Math.min(5, vrView.scale * delta));
      if (newScale === vrView.scale) return;

      // 鼠标在 viewBox 坐标系的位置
      const pt = svgEl.createSVGPoint();
      pt.x = e.clientX; pt.y = e.clientY;
      const ctm = svgEl.getScreenCTM();
      if (!ctm) return;
      const mouseVb = pt.matrixTransform(ctm.inverse());

      // 调整 translate 使鼠标位置在缩放后保持不变
      const localX = (mouseVb.x - vrView.x) / vrView.scale;
      const localY = (mouseVb.y - vrView.y) / vrView.scale;
      vrView.x = mouseVb.x - newScale * localX;
      vrView.y = mouseVb.y - newScale * localY;
      vrView.scale = newScale;
      applyVrTransform();
    }, { passive: false });

    // 鼠标拖动平移
    let dragging = false, startX = 0, startY = 0, startTx = 0, startTy = 0;
    svgEl.addEventListener('mousedown', (e) => {
      // 左键才拖动
      if (e.button !== 0) return;
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      startTx = vrView.x; startTy = vrView.y;
      svgEl.classList.add('dragging');
      e.preventDefault();
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const rect = svgEl.getBoundingClientRect();
      const vb = svgEl.viewBox.baseVal;
      // 屏幕像素差转为 viewBox 单位
      const dx = (e.clientX - startX) * (vb.width / rect.width);
      const dy = (e.clientY - startY) * (vb.height / rect.height);
      vrView.x = startTx + dx;
      vrView.y = startTy + dy;
      applyVrTransform();
    });
    window.addEventListener('mouseup', () => {
      if (dragging) {
        dragging = false;
        svgEl.classList.remove('dragging');
      }
    });

    // 缩放控制按钮
    const btnIn = $('#vr-zoom-in');
    const btnOut = $('#vr-zoom-out');
    const btnReset = $('#vr-zoom-reset');
    if (btnIn) btnIn.addEventListener('click', () => zoomVrBy(1.2));
    if (btnOut) btnOut.addEventListener('click', () => zoomVrBy(0.83));
    if (btnReset) btnReset.addEventListener('click', resetVrView);
  }

  // ============ 文档查看器（内嵌 Markdown 解析，完全离线可用） ============
  const SYSTEM_DOC = `# 多级可信根系统总体设计报告

## 一、系统整体连接关系

### 1. 通信接口说明

- **一级到二级**：一级可信根 SoC 端通过 UART 连接到 UART-USB 转接板，再连接至二级 PS 端 USB 口。
- **三级到二级**：三级可信根 OpenTitan 通过 UART 连接到 UART-USB 转接板，再连接至二级 PS 端 USB 口。
- **三级到 HOST**：三级可信根 OpenTitan 通过 SAM3X 将 UART 信号转为 USB，再连接至 HOST。
- **三级到验证方**：三级可信根 OpenTitan 通过 FT4232 将 UART 信号转为 USB，再连接至验证方。
- **HOST 与验证方**：通过网络通信。
- **二级的操作控制**：二级可信根 PS 通过网线连接网络，HOST 可通过 SSH 登录二级可信根 Ubuntu。

### 2. 信任链架构

本项目原型系统为集群内部异构处理器与计算平台提供轻量化的可信启动/安全启动，并为集群间与可信第三方提供高效的远程证明。

## 二、多级可信根硬件架构

### 1. 三级可信根 — OpenTitan SoC (集群管理平台 / VCU129)

Top Earlgrey 是 OpenTitan 项目的顶级芯片配置实例，构建开源、高安全性的可信根 SoC。

**核心特性：**

- **处理器**：RV32IMCB RISC-V Ibex 核心，3 级流水线，支持 M/U 模式与 ePMP。
- **存储**：2×512KB eFlash、128KB SRAM、4KB AON SRAM、32KB ROM、2KB OTP。
- **安全加速**：AES、SM3、SM4、PUF、HMAC/SHA-256、KMAC/SHA3、OTBN、CSRNG。
- **总线**：TileLink Uncached Light (TL-UL)，两级层次（高速/低速集群）。
- **关键模块**：Key Manager(DICE)、Lifecycle Controller、Alert Handler、OTP 控制器、Flash 控制器。

### 2. 二级可信根 — Zynq MPSoC (计算平台 / ZCU104)

基于 Xilinx Zynq UltraScale+ MPSoC，PS 端 ARM Cortex-A53 运行 Linux Ubuntu，PL 端构建 Caliptra 安全协处理器。

**核心特性：**

- **PS 端**：四核 Cortex-A53 @1.5GHz，DDR4，运行虚拟机与 SWTPM/vTPM。
- **PL 端**：VEER el2 64 位 RISC-V + Caliptra 硬件信任根，100MHz。
- **总线**：AXI4 互联矩阵（M_AXI_HPM0_LPD），AXI-APB 桥接器，AXI BRAM 控制器。
- **安全**：PL 端 Caliptra 硬件隔离，PS/PL 安全域分离。

### 3. 一级可信根 — Caliptra + 主CPU (异构处理器芯片)

采用 ARM Cortex-M3 内核（或 RISC-V Rocket Core），安全协处理器采用 Caliptra。

**核心特性：**

- **主 CPU**：Cortex-M3，AHB/APB 总线互联，ITCM/DTCM/FW_STORE 存储。
- **Caliptra**：VeeR EL2 RISC-V 独立核心，APB3 从设备 (0x30000000)。
- **安全模块**：SHA512/SHA256、ECC/HMAC、PCR Vault、Key Vault、Data Vault、DOE、TRNG。
- **通信**：Mailbox 邮箱实现主 CPU 与 Caliptra 双向通信。

## 三、启动流程与信任链构建

### 1. 启动阶段

1. **time1 初始化与准备**：各级上电、ROM 执行、密钥派生、DICE 证书链生成。
2. **time2 AK 证书签发**：三级向 Privacy CA 申请 AK 证书（含 ML-DSA 公钥）。
3. **time3 二级启动授权**：三级度量二级 caliptraROM，签发二级设备证书。
4. **time4 一级启动授权**：二级校验一级 PCR，签发一级设备证书，主 CPU 跳转应用固件。
5. **time5 远程证明**：验证方挑战，三级生成 Quote 包，ML-DSA 签名返回。

### 2. Quote 包结构（总计 20890 字节）

| 字段 | 大小 | 说明 |
|------|------|------|
| 帧头 | 7B | #QUOTE# |
| AK证书长度 | 4B | 大端 HEX |
| AK证书 | 11488B | DER X.509（含 ML-DSA 公钥）|
| PCR值 | 64B | 32 字节转 HEX |
| Nonce | 64B | 挑战数转 HEX |
| Quote 包含 证书链验证状态 | 4B | 0xaa 成功/0xba 失败 |
| ML-DSA签名 | 9254B | 4627 字节签名转 HEX |
| 帧尾 | 5B | #END# |

### 3. PCR 扩展运算

PCR_new[i] = SHA512(PCR_old[i] || 待扩展度量值)

该操作确保度量值的顺序敏感性与不可逆性。

## 四、安全特性

- **PUF 内生密钥**：私钥永不离开芯片安全边界，根密钥内生。
- **后量子签名**：ML-DSA 抗量子攻击，公钥嵌入 X.509 扩展字段。
- **层级化 PKI**：Privacy CA → 三级 → 二级 → 一级 的证书签发链。
- **度量授权链**：自上而下控制流（三级→二级→一级），未经度量授权下级不可执行。
- **失败保护**：度量失败触发告警处理器、密钥锁定、安全失效状态。
`;

  function simpleMarkdown(md) {
    if (!md) return '<p>文档内容为空</p>';
    let html = md.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    // 代码块
    html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    // 表格（简单支持）
    html = html.replace(/^(\|.+\|)\n(\|[\s\-:|]+\|)\n((?:\|.+\|\n?)+)/gm, (m, header, sep, body) => {
      const hCells = header.split('|').filter(c => c.trim()).map(c => `<th>${c.trim()}</th>`).join('');
      const rows = body.trim().split('\n').map(row => {
        const cells = row.split('|').filter(c => c.trim()).map(c => `<td>${c.trim()}</td>`).join('');
        return `<tr>${cells}</tr>`;
      }).join('');
      return `<table><thead><tr>${hCells}</tr></thead><tbody>${rows}</tbody></table>`;
    });
    // 标题
    html = html.replace(/^####\s+(.*)$/gm, '<h4>$1</h4>');
    html = html.replace(/^###\s+(.*)$/gm, '<h3>$1</h3>');
    html = html.replace(/^##\s+(.*)$/gm, '<h2>$1</h2>');
    html = html.replace(/^#\s+(.*)$/gm, '<h1>$1</h1>');
    // 粗体、斜体、行内代码
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    html = html.replace(/\`([^\`]+)\`/g, '<code>$1</code>');
    // 列表
    html = html.replace(/^\s*[-*]\s+(.*)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>(?:[\s\S]*?)<\/li>)(?!\s*<li>)/g, '<ul>$1</ul>');
    // 段落
    html = html.split(/\n\n+/).map(block => {
      const t = block.trim();
      if (!t) return '';
      if (/^<(h\d|ul|pre|table|p)/.test(t)) return block;
      return `<p>${block.replace(/\n/g, '<br>')}</p>`;
    }).join('\n');
    return html;
  }
